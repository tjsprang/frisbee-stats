<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Frisbee Stats</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #6b7280;
    --line: #e3e5ea; --accent: #ff6a1a; --accent-text: #ffffff;
    --good: #16a34a; --bad: #dc2626; --d: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #1a1d24; --text: #eef0f4; --muted: #9aa1ad;
      --line: #2a2f39; --accent: #ff7a2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--card);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  }
  header .logo { font-weight: 800; margin-right: auto; color: var(--text); padding: 6px 0; }
  header .logo span { color: var(--accent); }
  #modeTag { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-left: 4px; }
  body.player .admin-only { display: none; }
  body.no-nav header a[data-nav] { display: none; }
  header a { color: var(--muted); text-decoration: none; font-weight: 600; padding: 6px 10px; border-radius: 8px; }
  header a.on { color: var(--text); background: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 14px; }
  h2 { font-size: 17px; margin: 22px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 0; }
  .row > .small { flex: 0 0 auto; }
  button, .btn {
    font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 14px;
    background: var(--bg); color: var(--text); cursor: pointer; text-decoration: none;
    display: inline-block; text-align: center; border: 1px solid var(--line);
  }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  button.small, .btn.small { padding: 6px 10px; font-size: 14px; border-radius: 8px; white-space: nowrap; }
  button:active { transform: scale(0.97); }
  select, input {
    font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); width: 100%;
  }
  input[type=color] { padding: 2px; height: 46px; width: 56px; flex: 0 0 56px; }
  .game-link { display: flex; justify-content: space-between; align-items: center; color: inherit; text-decoration: none; }
  .badge { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 99px; background: var(--line); }
  .badge.live { background: var(--bad); color: #fff; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  /* Scoreboard */
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; padding: 14px 8px; }
  .scoreboard .team { font-weight: 700; font-size: 15px; }
  .scoreboard .nums { font-size: 40px; font-weight: 900; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .tabs button { border-width: 2px; }
  .tabs button.on { color: #fff; }
  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .player {
    text-align: left; padding: 14px 12px; min-height: 72px; background: var(--card);
    border-left: 6px solid var(--team, var(--accent));
  }
  .player .num { color: var(--muted); font-weight: 800; margin-right: 4px; }
  .player .line { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .log { list-style: none; padding: 0; margin: 0; }
  .log li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; display: flex; gap: 8px; }
  .log li:last-child { border-bottom: 0; }
  .log .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tag { font-weight: 800; }
  .tag.goal, .tag.callahan { color: var(--good); }
  .tag.d { color: var(--d); }
  .tag.throwaway, .tag.drop { color: var(--bad); }
  .tag.half { color: var(--accent); }

  /* Bottom sheet */
  #sheet { display: none; }
  #sheet.open { display: block; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--card);
    border-radius: 18px 18px 0 0; padding: 18px 16px 24px; max-height: 80vh; overflow-y: auto;
    max-width: 720px; margin: 0 auto;
  }
  .panel h3 { margin: 0 0 14px; font-size: 18px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions button { padding: 18px 10px; font-size: 17px; }
  .actions .goal { background: var(--good); color: #fff; border: 0; }
  .actions .d { background: var(--d); color: #fff; border: 0; }
  .actions .to { background: var(--bad); color: #fff; border: 0; }
  .actions .full { grid-column: 1 / -1; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; cursor: pointer; user-select: none; }
  th.sorted { color: var(--accent); }
  .roster li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .roster { list-style: none; padding: 0; margin: 0 0 10px; }

  /* Sign in */
  body.signed-out header a[data-nav], body.signed-out #modeTag { display: none; }

  /* Main menu */
  .menu { display: grid; gap: 14px; margin-top: 10px; }
  .menu a {
    display: flex; gap: 16px; align-items: center; padding: 22px 18px; color: inherit; text-decoration: none;
    border-left: 6px solid var(--accent);
  }
  .menu a:active { transform: scale(0.98); }
  .menu .icon { font-size: 36px; }
  .menu b { font-size: 20px; display: block; margin-bottom: 2px; }
  .auth { max-width: 380px; margin: 40px auto 0; padding: 22px; }
  .auth form { display: grid; gap: 10px; margin-bottom: 10px; }
  .auth .links { display: flex; justify-content: space-between; margin-top: 14px; font-size: 14px; }
  .auth .links a { color: var(--accent); cursor: pointer; font-weight: 600; }
  .msg { font-size: 14px; min-height: 20px; }
  .msg.error { color: var(--bad); }
  code { background: var(--bg); padding: 1px 5px; border-radius: 5px; }

  /* League border editor */
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
  .preset { height: 38px; padding: 0; border-radius: 10px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .swatch { display: inline-flex; gap: 4px; align-items: center; }
  .swatch input[type=color] { width: 52px; height: 40px; padding: 2px; }
  .badge.scheduled { background: var(--d); color: #fff; }

  /* Schedule creator */
  .options { display: grid; gap: 10px; }
  .option { display: flex; gap: 12px; align-items: flex-start; padding: 14px; cursor: pointer; margin: 0; }
  .option input { width: auto; margin-top: 3px; accent-color: var(--accent); }
  .option:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .round h3 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .match { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .match:last-child { border-bottom: 0; }

  /* Lineup */
  .lineup-bar { margin-bottom: 10px; }
  .players.bench .player { opacity: .6; min-height: 56px; }
  .actions .divider { font-size: 13px; margin-top: 6px; }
  .actions button.in { background: var(--good); color: #fff; border-color: transparent; }

  /* Player claims and profiles */
  .claim-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .claim-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .badge.you { background: var(--good); color: #fff; }
  .claimed { font-size: 12px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; text-align: center; }
  .stat-grid b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .stat-grid span { font-size: 12px; }
  tr.me td { background: color-mix(in srgb, var(--good) 15%, transparent); }
  .scoreboard.live-board { position: relative; }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px;
    animation: pulse 1.4s ease-in-out infinite; vertical-align: middle; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* Chart colours: the first slots of a colourblind-validated palette, with their own dark-mode steps */
  :root { --series-1: #2a78d6; --series-2: #eb6834; --grid: #e1e0d9; --axis: #c3c2b7; --ink-muted: #898781; }
  @media (prefers-color-scheme: dark) {
    :root { --series-1: #3987e5; --series-2: #d95926; --grid: #2c2c2a; --axis: #383835; }
  }

  /* Pass-by-pass tracker */
  .phase-head { font-size: 18px; font-weight: 800; margin: 4px 0 10px; }
  .phase .tabs button { font-size: 16px; padding: 16px 10px; }
  .holder { font-size: 17px; border-left: 6px solid var(--team); }
  .play-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 4px; }
  .play-actions button { padding: 16px 10px; font-size: 16px; }
  .play-actions .goal { background: var(--good); color: #fff; border: 0; }
  .play-actions .to { background: var(--bad); color: #fff; border: 0; }
  .tag.pass, .tag.pickup { color: var(--muted); }
  .tag.pull { color: var(--d); }
  .tag.stall { color: var(--bad); }

  /* Stat categories, tiles and game pages */
  .cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 4px 0 10px; }
  .cat-tabs button { flex: 0 0 auto; padding: 7px 12px; font-size: 14px; border-radius: 99px; white-space: nowrap; }
  .cat-tabs button.on { background: var(--text); color: var(--bg); border-color: transparent; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .tile-label { font-size: 13px; color: var(--muted); }
  .tile b { font-size: 26px; font-weight: 700; }
  .tile-note { font-size: 12px; color: var(--muted); }
  .leaders-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .leaders-list div { display: flex; flex-direction: column; font-size: 14px; }
  .point-row { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .point-row:last-child { border-bottom: 0; }
  .point-head { display: flex; gap: 8px; align-items: center; margin-bottom: 2px; }
  .point-head b { flex: 1; }
  .on-field { font-size: 12px; margin-top: 4px; }
  .foot { font-size: 12px; }
  th[title] { text-decoration: underline dotted; text-underline-offset: 3px; }

  /* Charts */
  .chart { overflow: hidden; }
  .chart svg { display: block; margin-top: 8px; overflow: visible; }
  .chart-title { font-weight: 700; margin-bottom: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .swatch.series-1 { background: var(--series-1); } .swatch.series-2 { background: var(--series-2); }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .axis { stroke: var(--axis); stroke-width: 1; }
  .chart .guide { stroke: var(--axis); stroke-width: 1; }
  .chart .tick { fill: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .end-label, .chart .node-label { fill: var(--text); font-size: 12px; font-weight: 600; }
  .chart .in-label { fill: #fff; font-size: 12px; font-weight: 700; pointer-events: none; }
  .chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .line.series-1 { stroke: var(--series-1); } .chart .line.series-2 { stroke: var(--series-2); }
  .chart .dot { stroke: var(--card); stroke-width: 2; }
  .chart .dot.series-1, .chart .bar.series-1, .chart .node { fill: var(--series-1); }
  .chart .dot.series-2, .chart .bar.series-2 { fill: var(--series-2); }
  .chart .hit { fill: transparent; cursor: pointer; outline: none; }
  .chart .flow { fill: none; stroke: var(--ink-muted); stroke-opacity: .28; cursor: pointer; outline: none; }
  .chart .flow.lit { stroke: var(--series-1); stroke-opacity: .6; }
  .chart .node { cursor: pointer; outline: none; }
  /* Keyboard focus on a mark shows its tooltip (and guide line) rather than an outline that could be mistaken for data. */
  #chart-tip { position: fixed; z-index: 30; display: none; pointer-events: none; white-space: pre-line;
    background: var(--text); color: var(--bg); font-size: 13px; padding: 7px 10px; border-radius: 8px; max-width: 260px; }
  #chart-tip.show { display: block; }
  .table-twin { margin-top: 8px; font-size: 13px; }
  .table-twin summary { color: var(--muted); cursor: pointer; }
  .hbar { display: grid; grid-template-columns: minmax(70px, 30%) 1fr 28px; gap: 8px; align-items: center; font-size: 14px; padding: 4px 0; }
  .hbar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-track { height: 12px; }
  .hbar-track i { display: block; height: 100%; min-width: 4px; background: var(--series-1); border-radius: 0 4px 4px 0; }
  .hbar-val { text-align: right; font-variant-numeric: tabular-nums; }

  /* Leaders: All / Teams */
  .leader-tabs button.on { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .team-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .team-chips button { padding: 8px 12px; font-size: 14px; border-radius: 99px; white-space: nowrap; }
  .team-chips button.on { border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 18%, var(--card)); }

  /* Offline banner and messages */
  .pill {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 20; display: none;
    max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 99px;
    font-size: 14px; font-weight: 700; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .pill.show { display: block; }
  #sync { top: 64px; background: var(--bad); color: #fff; }
  #toast { bottom: 20px; background: var(--text); color: var(--bg); }

  /* Settings */
  .stepper { display: flex; align-items: center; gap: 18px; margin-top: 12px; }
  .stepper b { font-size: 32px; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
  .stepper button { width: 52px; height: 52px; font-size: 24px; padding: 0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="stats.js"></script>
</head>
<body>
<header>
  <a class="logo" href="#/">🥏 Frisbee<span>Stats</span> <small id="modeTag"></small></a>
  <a href="#/games" data-nav="games">Games</a>
  <a href="#/leaders" data-nav="leaders">Leaders</a>
  <a href="#/teams" data-nav="teams">Teams</a>
</header>
<main id="app"></main>
<div id="sheet"></div>
<div id="sync" class="pill" role="status"></div>
<div id="toast" class="pill" role="alert"></div>

<script>
// ---------- Supabase (accounts) ----------
// Paste these from your Supabase project: Project Settings → API.
// The anon/publishable key is designed to be public, so it's fine in this file.
const SUPABASE_URL = 'https://rjpqplseazvxzakakngh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_gAzJjWvSQmVd4tmyxYLwxg_9GirzS_0';

const sb = SUPABASE_URL && SUPABASE_KEY && window.supabase
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) // keeps the session in localStorage and auto-refreshes it
  : null;
let session = null, authReady = false, recovering = false, authMode = 'signin';

// The league the user is in, and which side they entered it from: 'player' (view only) or 'admin'.
let mode = null, league = null;
try {
  mode = localStorage.getItem('frisbee-mode');
  league = JSON.parse(localStorage.getItem('frisbee-league'));
} catch {}
const isAdmin = () => mode === 'admin';

// ---------- Data ----------
// A league's teams, games and plays live in Supabase and are loaded into `db`, which the screens read.
// Changes update `db` straight away (so taps feel instant) and are saved to Supabase in the background,
// in order, retrying while offline. Other people's changes arrive live through Supabase Realtime.
const LEGACY_KEY = 'frisbee-stats-v1';   // where this browser kept league data before Supabase
const uid = () => crypto.randomUUID();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function seed() {
  const mk = (name, color, names) => ({
    id: uid(), name, color,
    players: names.map((n, i) => ({ id: uid(), name: n, number: String((i * 7 + 3) % 99) }))
  });
  return {
    teams: [
      mk('Disc Jockeys', '#e4572e', ['Alex', 'Jordan', 'Sam', 'Riley', 'Casey', 'Morgan', 'Taylor', 'Jamie']),
      mk('Huck Norris', '#2e86de', ['Avery', 'Quinn', 'Reese', 'Drew', 'Parker', 'Rowan', 'Skyler', 'Emerson']),
      mk('Layout Legends', '#17a589', ['Hayden', 'Kai', 'Logan', 'Blake', 'Charlie', 'Dakota', 'Finley', 'Harper']),
      mk('Flick Fury', '#8e44ad', ['Jesse', 'Kendall', 'Micah', 'Nico', 'Peyton', 'Sage', 'Toby', 'Wren'])
    ],
    games: []
  };
}

const emptyDb = () => ({ teams: [], games: [], settings: { onField: 7 }, claims: [], claimsReady: false, passReady: false });
let db = emptyDb();
let dataLeagueId = null;   // which league `db` currently holds
let loading = null, loadError = null, channel = null;

function rememberLeague() {
  try { localStorage.setItem('frisbee-league', JSON.stringify(league)); } catch {}
}

// Supabase rows ⇄ the shapes the screens use.
const toGame = r => ({
  id: r.id, homeId: r.home_id, awayId: r.away_id, status: r.status, created: Number(r.created_ms),
  when: r.scheduled_at, field: r.field, round: r.round, lineup: r.lineup, pointPlayers: r.point_players,
  firstPull: r.first_pull || null, events: []
});
const toEvent = r => ({
  id: r.id, t: Number(r.t), type: r.type, teamId: r.team_id, playerId: r.player_id,
  ...(r.assist_id ? { assistId: r.assist_id } : {}), ...(r.target_id ? { targetId: r.target_id } : {}),
  ...(r.played ? { played: r.played } : {}), ...(r.detail ? { detail: r.detail } : {})
});
const teamRow = t => ({ id: t.id, league_id: league.id, name: t.name, color: t.color });
const playerRows = t => t.players.map((p, i) => ({
  id: p.id, league_id: league.id, team_id: t.id, name: p.name, number: String(p.number ?? ''), sort: i
}));
const gameRow = g => ({
  id: g.id, league_id: league.id, home_id: g.homeId, away_id: g.awayId, status: g.status, created_ms: g.created,
  scheduled_at: g.when || null, field: g.field ?? null, round: g.round ?? null,
  lineup: g.lineup || null, point_players: g.pointPlayers || null,
  ...(db.passReady ? { first_pull: g.firstPull || null } : {})   // column added by supabase/005
});
const eventRow = (g, e) => ({
  id: e.id, league_id: league.id, game_id: g.id, t: e.t, type: e.type, team_id: e.teamId || null,
  player_id: e.playerId || null, assist_id: e.assistId || null, played: e.played || null,
  ...(db.passReady ? { target_id: e.targetId || null, detail: e.detail || null } : {})
});

// All of a league's rows from one table. Supabase returns at most 1000 rows per request,
// so fetch the first page (with a total count), then the rest in parallel.
async function fetchAll(table, leagueId, orders) {
  const query = () => orders.reduce((q, o) => q.order(o), sb.from(table).select('*', { count: 'exact' }).eq('league_id', leagueId));
  const first = await query().range(0, 999);
  if (first.error) throw first.error;
  const pages = Math.ceil((first.count || 0) / 1000);
  const rest = await Promise.all(Array.from({ length: Math.max(0, pages - 1) }, (_, i) => query().range((i + 1) * 1000, (i + 2) * 1000 - 1)));
  for (const r of rest) if (r.error) throw r.error;
  return [first, ...rest].flatMap(r => r.data);
}

async function fetchLeague(id) {
  const [lg, teams, players, games, events, passProbe] = await Promise.all([
    sb.from('leagues').select('name, border_colors, on_field').eq('id', id).single()
      .then(r => { if (r.error) throw r.error; return r.data; }),
    fetchAll('teams', id, ['created_at', 'id']),
    fetchAll('players', id, ['sort', 'id']),
    fetchAll('games', id, ['id']),
    fetchAll('events', id, ['seq']),
    sb.from('games').select('first_pull').limit(1)   // fails until supabase/005 has been run
  ]);
  const claims = await fetchClaims(id);
  const next = {
    teams: teams.map(t => ({ id: t.id, name: t.name, color: t.color, players: [] })),
    games: games.map(toGame),
    settings: { onField: lg.on_field },
    claims: claims || [],
    claimsReady: !!claims,           // false until supabase/004_player_claims.sql has been run
    passReady: !passProbe.error      // false until supabase/005_pass_by_pass.sql has been run
  };
  for (const p of players) next.teams.find(t => t.id === p.team_id)?.players.push({ id: p.id, name: p.name, number: p.number, userId: p.user_id || null });
  const byId = Object.fromEntries(next.games.map(g => [g.id, g]));
  for (const e of events) byId[e.game_id]?.events.push(toEvent(e));
  if (league?.id === id) { league.name = lg.name; league.border_colors = lg.border_colors; rememberLeague(); }
  return next;
}

// Re-fetch everything (after someone else changes teams or settings, or after reconnecting).
let refreshTimer, missedRemote = false;
function refreshLeague() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    if (!league || dataLeagueId !== league.id) return;
    if (writes.length) { missedRemote = true; return; } // try again once our own changes are saved
    const id = league.id;
    try {
      const next = await fetchLeague(id);
      if (league?.id !== id) return;
      if (writes.length) { missedRemote = true; return; }
      db = next; rerender();
    } catch {}
  }, 400);
}

// ----- Saving: a queue of changes sent to Supabase one at a time, in order -----
const writes = [];
let flushing = false, offline = false;

// Queue a change. `fn` makes the Supabase request and resolves to { error }.
function persist(fn) {
  writes.push({ fn, leagueId: league.id });
  flush();
}

// Run several requests in order, stopping at the first error.
const steps = (...makers) => async () => {
  for (const make of makers) { const r = await make(); if (r.error) return r; }
  return { error: null };
};

async function flush() {
  if (flushing) return;
  flushing = true;
  while (writes.length) {
    let error;
    try { ({ error } = await writes[0].fn()); } catch (err) { error = { message: String(err) }; }
    if (error && !error.code) {
      // No answer from Supabase (no signal, or a hiccup): wait and retry the same change.
      offline = true; updateSyncBadge();
      await new Promise(r => setTimeout(r, 3000));
      continue;
    }
    offline = false;
    const w = writes.shift();
    if (error) {
      // Supabase refused it (e.g. not an admin of this league): drop it and re-sync with the server.
      toast(`Couldn’t save a change: ${dbErrorText(error)}`);
      if (league?.id === w.leagueId) missedRemote = true;
    }
    updateSyncBadge();
  }
  flushing = false;
  updateSyncBadge();
  if (missedRemote) { missedRemote = false; refreshLeague(); }
}

const saveGame = g => { const row = gameRow(g); persist(() => sb.from('games').upsert(row)); };
const saveEvent = (g, e) => { const row = eventRow(g, e); persist(() => sb.from('events').upsert(row)); };

window.addEventListener('beforeunload', e => { if (writes.length) { e.preventDefault(); e.returnValue = ''; } });

function updateSyncBadge() {
  const el = document.getElementById('sync');
  el.textContent = offline ? `Offline · ${writes.length} change${writes.length === 1 ? '' : 's'} waiting to save` : '';
  el.classList.toggle('show', offline && writes.length > 0);
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 6000);
}

// ----- Live updates from other devices -----
let needsRender = false, subscribedOnce = false;

// Re-render with fresh data, unless the user is mid-way through something (a pop-up, typing, editing a team).
function rerender() {
  const typing = ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName);
  if (sheet.classList.contains('open') || typing || editing) { needsRender = true; return; }
  const y = scrollY; route(); scrollTo(0, y);
}

function subscribeLeague(id) {
  if (channel) sb.removeChannel(channel);
  subscribedOnce = false;
  const f = `league_id=eq.${id}`;
  const on = (event, table, handler, filter = f) =>
    channel.on('postgres_changes', { event, schema: 'public', table, ...(filter ? { filter } : {}) }, handler);
  channel = sb.channel(`league-${id}`);
  on('INSERT', 'events', p => remoteEvent(p.new));
  on('INSERT', 'games', p => remoteGame(p.new));
  on('UPDATE', 'games', p => remoteGame(p.new));
  on('*', 'teams', refreshLeague);
  on('*', 'players', refreshLeague);
  on('UPDATE', 'leagues', refreshLeague, `id=eq.${id}`);
  // Deletes can't be filtered by league, so check whether the row is one of ours.
  on('DELETE', 'events', p => remoteDelete('event', p.old.id), null);
  on('DELETE', 'games', p => remoteDelete('game', p.old.id), null);
  on('DELETE', 'teams', p => { if (team(p.old.id)) refreshLeague(); }, null);
  on('DELETE', 'players', p => { if (db.teams.some(t => t.players.some(x => x.id === p.old.id))) refreshLeague(); }, null);
  if (db.claimsReady) {   // only once the claims table exists
    on('INSERT', 'player_claims', p => remoteClaim(p.new));
    on('UPDATE', 'player_claims', p => remoteClaim(p.new));
    on('DELETE', 'player_claims', p => { if (db.claims.some(c => c.id === p.old.id)) { db.claims = db.claims.filter(c => c.id !== p.old.id); rerender(); } }, null);
  }
  channel.subscribe(status => {
    if (status !== 'SUBSCRIBED') return;
    if (subscribedOnce) refreshLeague(); // reconnected: catch up on anything missed
    subscribedOnce = true;
  });
}

function unsubscribeLeague() {
  if (channel) sb.removeChannel(channel);
  channel = null;
}

function remoteEvent(r) {
  const g = game(r.game_id);
  if (!g || g.events.some(e => e.id === r.id)) return; // not ours, or our own change coming back
  g.events.push(toEvent(r));
  rerender();
}

function remoteClaim(c) {
  const i = db.claims.findIndex(x => x.id === c.id), before = db.claims[i];
  if (i >= 0) db.claims[i] = c; else db.claims.push(c);
  const p = player(c.player_id);
  // Notifications: admins hear about new requests; the person claiming hears the decision.
  if (!before && c.status === 'pending' && isAdmin() && c.user_id !== me())
    toast(`🔔 ${c.user_email || 'Someone'} wants to claim ${p.name}. Approve it on the Games page.`);
  if (before?.status === 'pending' && c.user_id === me() && c.status !== 'pending')
    toast(c.status === 'approved' ? `✅ You’re now linked to ${p.name}!` : `Your claim for ${p.name} was denied.`);
  rerender();
}

function remoteGame(r) {
  const next = toGame(r), g = game(r.id);
  if (g) {
    const same = JSON.stringify(gameRow(g)) === JSON.stringify(gameRow({ ...next }));
    if (same) return;                                      // our own change coming back
    if (writes.length) { missedRemote = true; return; }    // our newer changes are still saving; re-sync after
    Object.assign(g, next, { events: g.events });
  } else {
    db.games.push(next);
  }
  rerender();
}

function remoteDelete(kind, id) {
  if (kind === 'game') {
    if (!game(id)) return;
    db.games = db.games.filter(g => g.id !== id);
  } else {
    const g = db.games.find(g => g.events.some(e => e.id === id));
    if (!g) return;
    g.events = g.events.filter(e => e.id !== id);
  }
  rerender();
}

// ----- One-time upload of data this browser saved before leagues moved to Supabase -----
function legacyData() {
  try {
    const d = JSON.parse(localStorage.getItem(`${LEGACY_KEY}:${league.id}`));
    return d && (d.teams?.length || d.games?.length) ? d : null;
  } catch { return null; }
}

function discardLegacy() {
  if (!confirm('Delete the teams and games saved on this device? They won’t be uploaded.')) return;
  try { localStorage.removeItem(`${LEGACY_KEY}:${league.id}`); } catch {}
  route();
}

async function uploadLegacy(btn) {
  const d = legacyData();
  if (!d) return;
  btn.disabled = true; btn.textContent = 'Uploading…';
  const chunks = (rows, n = 500) => Array.from({ length: Math.ceil(rows.length / n) }, (_, i) => rows.slice(i * n, i * n + n));
  const games = (d.games || []).map(g => ({ ...g, created: g.created || Date.now() }));
  const run = steps(
    () => sb.from('teams').upsert(d.teams.map(teamRow)),
    () => sb.from('players').upsert(d.teams.flatMap(playerRows)),
    () => sb.from('games').upsert(games.map(gameRow)),
    ...chunks(games.flatMap(g => g.events.map(e => eventRow(g, e)))).map(rows => () => sb.from('events').upsert(rows)),
    ...(d.settings?.onField ? [() => sb.rpc('set_league_on_field', { p_league_id: league.id, p_on_field: d.settings.onField })] : [])
  );
  const { error } = await run();
  if (error) { btn.disabled = false; btn.textContent = 'Try again'; toast(`Upload failed: ${dbErrorText(error)}`); return; }
  try { localStorage.removeItem(`${LEGACY_KEY}:${league.id}`); } catch {}
  toast('Uploaded! Everyone in the league can see these teams and games now.');
  dataLeagueId = null; route();
}

const team = id => db.teams.find(t => t.id === id);
const game = id => db.games.find(g => g.id === id);
function player(id) {
  for (const t of db.teams) { const p = t.players.find(p => p.id === id); if (p) return p; }
  return { id, name: '(removed)', number: '' };
}
const pname = id => { const p = player(id); return `${p.name}${p.number !== '' ? ' #' + p.number : ''}`; };
const score = (g, tid) => g.events.filter(e => e.teamId === tid && (e.type === 'goal' || e.type === 'callahan')).length;

// Player and team stats are worked out by analyze() in stats.js.

const LABEL = {
  goal: 'Goal', d: 'D', throwaway: 'Throwaway', drop: 'Drop', callahan: 'Callahan', half: 'Halftime',
  pull: 'Pull', pickup: 'Pickup', pass: 'Pass', stall: 'Stall'
};

// Halftime is stored as a 'half' event in the play-by-play (no player attached).
// Returns the score at halftime, or null if the game hasn't reached it.
function halftimeScore(g) {
  const i = g.events.findIndex(e => e.type === 'half');
  if (i < 0) return null;
  const first = { ...g, events: g.events.slice(0, i) };
  return [score(first, g.homeId), score(first, g.awayId)];
}

function route() {

  if (!authReady) { app.innerHTML = ''; return; }
  if (recovering) return renderNewPassword();

  const [page, id] = location.hash.replace(/^#\/?/, '').split('/');
  const inLeague = !!(league && mode) && ['games', 'game', 'box', 'leaders', 'teams', 'schedule', 'settings', 'profile', 'team'].includes(page);

    a.classList.toggle('on', (a.dataset.nav === 'games' && ['games', 'game', 'box', 'schedule', 'settings'].includes(page))
      || (a.dataset.nav === 'teams' && (page === 'profile' || page === 'team')) || a.dataset.nav === page));
  if (page === 'admin') return id === 'create' ? renderCreateLeague() : renderAdminHome();
  if (page === 'player') return renderPlayerHome();
  if (!inLeague) return renderMenu();
  if (dataLeagueId !== league.id) {
    if (loadError) {
      app.innerHTML = `<h1>${esc(league.name)}</h1><p class="msg error">Couldn’t load this league: ${esc(loadError)}</p>
        <button class="primary" onclick="loadError = null; route()">Try again</button>`;
    } else {
      app.innerHTML = `<h1>${esc(league.name)}</h1><p class="muted">Loading league…</p>`;
      loadLeague();
    }
    return;
  }
  if (page === 'game' && game(id)) return isAdmin() ? renderTracker(game(id)) : renderBox(game(id));
  if (page === 'box' && game(id)) return renderBox(game(id));
  if (page === 'leaders') return renderLeaders();
  if (page === 'teams') return isAdmin() ? renderTeams() : renderRosters();
  if (page === 'profile') return renderProfile(id);
  if (page === 'team') return renderTeamPage(id);
  if (page === 'schedule' && isAdmin()) return renderSchedule();
  if (page === 'settings' && isAdmin()) return renderSettings();
  renderGames();
}

function dbErrorText(error) {

}

// A league's border: one colour = solid, 2–4 colours = a multicoloured blend.
function borderStyle(colors) {
  const c = (colors || []).filter(x => /^#[0-9a-f]{6}$/i.test(x));
  if (!c.length) return '';
  const stops = c.length === 1 ? `${c[0]}, ${c[0]}` : c.join(', ');
  return `border: 3px solid transparent; background: linear-gradient(var(--card), var(--card)) padding-box, linear-gradient(90deg, ${stops}) border-box;`;
}

async function decideClaim(id, approve, btn) {
  btn.disabled = true;
  const { data, error } = await sb.rpc('decide_claim', { p_claim_id: id, p_approve: approve });
  if (error) { btn.disabled = false; toast(dbErrorText(error)); refreshLeague(); return; }
  const p = player(data.player_id);
  if (approve) {
    // Mirror what the database did: link the player, and turn down anyone else waiting on them.
    const pl = db.teams.flatMap(t => t.players).find(x => x.id === data.player_id);
    if (pl) pl.userId = data.user_id;
    db.claims.forEach(c => { if (c.player_id === data.player_id && c.status === 'pending') c.status = 'denied'; });
  }
  const i = db.claims.findIndex(c => c.id === id);
  if (i >= 0) db.claims[i] = data;
  toast(approve ? `Approved: ${data.user_email || 'they'} can now follow ${p.name}’s stats.` : `Denied the claim for ${p.name}.`);
  route();
}

// ---------- Schedule creator ----------
const pad = n => String(n).padStart(2, '0');
const localDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localDateTime = d => `${localDate(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

let sched = null;          // the creator's settings, kept while you tweak them
let schedPreview = null;   // the generated games, shown before saving

// Circle-method round robin: every team plays every other team exactly once.
// With an odd number of teams, one team sits out (a bye) each round.
function roundRobin(ids) {
  const t = [...ids];
  if (t.length % 2) t.push(null);
  const n = t.length, rounds = [], homes = {};
  for (let r = 0; r < n - 1; r++) {
    const games = []; let bye = null;
    for (let i = 0; i < n / 2; i++) {
      const x = t[i], y = t[n - 1 - i];
      if (!x || !y) { bye = x || y; continue; }
      // Keep home games balanced: whoever has hosted less so far is home.
      const [h, a] = (homes[x] || 0) <= (homes[y] || 0) ? [x, y] : [y, x];
      homes[h] = (homes[h] || 0) + 1;
      games.push([h, a]);
    }
    rounds.push({ games, bye });
    t.splice(1, 0, t.pop()); // rotate everyone except the first team
  }
  return rounds;
}

const flipRound = r => ({ games: r.games.map(([h, a]) => [a, h]), bye: r.bye });

function shuffled(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function buildRounds(s) {
  const ids = db.teams.map(t => t.id);
  const base = roundRobin(s.shuffle ? shuffled(ids) : ids);
  if (s.type === 'single') return base;
  if (s.type === 'double') return [...base, ...base.map(flipRound)];
  // Set number of rounds: cycle through the round robin, swapping home/away on each repeat.
  return Array.from({ length: s.rounds }, (_, i) =>
    Math.floor(i / base.length) % 2 ? flipRound(base[i % base.length]) : base[i % base.length]);
}

function renderSchedule() {
  if (db.teams.length < 2) { location.hash = '#/games'; return; }
  sched = sched || { type: 'single', rounds: 8, shuffle: false, start: localDate(new Date()), time: '18:00', every: 7, fields: 1, length: 60 };
  const n = db.teams.length;
  const perRound = n % 2 ? n : n - 1;           // rounds in one full round robin
  const single = n * (n - 1) / 2;               // games in one full round robin
  const opt = (value, title, text) => `
    <label class="card option">
      <input type="radio" name="stype" value="${value}" ${sched.type === value ? 'checked' : ''} onchange="sched.type = this.value; schedPreview = null; renderSchedule()">
      <span><b>${title}</b><div class="muted">${text}</div></span>

  app.innerHTML = `

    <p class="muted">${n} teams: ${db.teams.map(t => esc(t.name)).join(', ')}.${n % 2 ? ' With an odd number of teams, one team has a bye each round.' : ''}</p>

    <h2>1. Pick a format</h2>
    <div class="options">
      ${opt('single', 'Single round robin', `Every team plays every other team once. ${perRound} rounds, ${single} games.`)}
      ${opt('double', 'Double round robin', `Every team plays every other team twice, with home and away swapped. ${perRound * 2} rounds, ${single * 2} games.`)}
      ${opt('rounds', 'Set number of rounds', 'Choose how many rounds (e.g. weeks) your season has. Matchups rotate through the round robin so teams face each other as evenly as possible.')}
    </div>
    ${sched.type === 'rounds' ? `<label class="field" style="margin-top:10px">Number of rounds
      <input type="number" min="1" max="100" value="${sched.rounds}" oninput="sched.rounds = +this.value; schedChanged()"></label>` : ''}
    <label class="card option" style="margin-top:10px">
      <input type="checkbox" ${sched.shuffle ? 'checked' : ''} onchange="sched.shuffle = this.checked; schedChanged()">
      <span><b>Shuffle matchups</b><div class="muted">Randomize who plays whom in each round instead of using the team list order.</div></span>
    </label>

    <h2>2. Dates and fields</h2>
    <div class="card grid2">
      <label class="field">First game date<input type="date" value="${sched.start}" oninput="sched.start = this.value; schedChanged()"></label>
      <label class="field">First game time<input type="time" value="${sched.time}" oninput="sched.time = this.value; schedChanged()"></label>
      <label class="field">Days between rounds<input type="number" min="1" max="60" value="${sched.every}" oninput="sched.every = +this.value; schedChanged()"></label>
      <label class="field">Fields available<input type="number" min="1" max="20" value="${sched.fields}" oninput="sched.fields = +this.value; schedChanged()"></label>
      <label class="field">Game length (minutes)<input type="number" min="10" max="300" step="5" value="${sched.length}" oninput="sched.length = +this.value; schedChanged()"></label>
    </div>
    <p class="muted">If a round has more games than fields, the extra games start one game length later.</p>

    <div class="msg error" id="schedMsg"></div>
    <button class="primary" style="width:100%" onclick="previewSchedule()">Preview schedule</button>
    <div id="preview">${schedPreview ? previewHtml() : ''}</div>`;
}

// Any settings change makes the current preview out of date.
function schedChanged() {
  schedPreview = null;
  const p = document.getElementById('preview');
  if (p) p.innerHTML = '';
}

function previewSchedule() {
  const s = sched, err = t => { document.getElementById('schedMsg').textContent = t; };
  if (!s.start || !s.time) return err('Pick a date and time for the first game.');
  if (!(s.every >= 1)) return err('Days between rounds must be at least 1.');
  if (!(s.fields >= 1 && s.fields <= 20)) return err('Fields available must be between 1 and 20.');
  if (!(s.length >= 10)) return err('Game length must be at least 10 minutes.');
  if (s.type === 'rounds' && !(s.rounds >= 1 && s.rounds <= 100)) return err('Number of rounds must be between 1 and 100.');
  err('');
  schedPreview = buildRounds(s).map((r, ri) => {
    const day = new Date(`${s.start}T${s.time}`);
    day.setDate(day.getDate() + ri * s.every);
    return {
      bye: r.bye,
      games: r.games.map(([homeId, awayId], gi) => {
        const t = new Date(day);
        t.setMinutes(t.getMinutes() + Math.floor(gi / s.fields) * s.length);
        return { id: uid(), homeId, awayId, status: 'scheduled', round: ri + 1, field: gi % s.fields + 1,
          when: localDateTime(t), created: Date.now(), events: [] };
      })
    };
  });
  document.getElementById('preview').innerHTML = previewHtml();
  document.getElementById('preview').scrollIntoView({ behavior: 'smooth' });
}

function previewHtml() {
  const games = schedPreview.flatMap(r => r.games);
  const perTeam = {};
  games.forEach(g => { perTeam[g.homeId] = (perTeam[g.homeId] || 0) + 1; perTeam[g.awayId] = (perTeam[g.awayId] || 0) + 1; });
  const counts = db.teams.map(t => perTeam[t.id] || 0);
  const min = Math.min(...counts), max = Math.max(...counts);
  const existing = db.games.filter(g => g.status === 'scheduled').length;
  const time = w => new Date(w).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return `
    <h2>Preview</h2>
    <div class="card"><b>${schedPreview.length} rounds · ${games.length} games</b>
      <div class="muted">Each team plays ${min === max ? min : `${min}–${max}`} games.</div></div>
    ${schedPreview.map((r, i) => `
      <div class="card round">
        <h3><span>Round ${i + 1}</span><span class="muted">${new Date(r.games[0]?.when || Date.now()).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}</span></h3>
        ${r.games.map(g => `<div class="match">
          <span><span class="dot" style="background:${team(g.homeId).color}"></span>${esc(team(g.homeId).name)}
            <span class="muted">vs</span> <span class="dot" style="background:${team(g.awayId).color}"></span>${esc(team(g.awayId).name)}</span>
          <span class="muted">${time(g.when)} · F${g.field}</span></div>`).join('')}
        ${r.bye ? `<div class="match muted"><span>Bye: ${esc(team(r.bye).name)}</span></div>` : ''}
      </div>`).join('')}
    <div class="row" style="margin-bottom:24px">
      ${existing ? `<button onclick="saveSchedule(false)">Add to current schedule</button>
        <button class="primary" onclick="saveSchedule(true)">Replace current (${existing} games)</button>`
        : '<button class="primary" onclick="saveSchedule(false)">Save schedule</button>'}
    </div>`;
}

function saveSchedule(replace) {
  if (replace && !confirm('Remove the current upcoming games and use this schedule instead?')) return;
  const leagueId = league.id, added = schedPreview.flatMap(r => r.games), rows = added.map(gameRow);
  if (replace) db.games = db.games.filter(g => g.status !== 'scheduled');
  db.games.push(...added);
  persist(steps(
    ...(replace ? [() => sb.from('games').delete().eq('league_id', leagueId).eq('status', 'scheduled')] : []),
    () => sb.from('games').upsert(rows)
  ));
  schedPreview = null;
  location.hash = '#/games';
}

function newGame() {
  const homeId = document.getElementById('home').value, awayId = document.getElementById('away').value;
  if (homeId === awayId) return alert('Pick two different teams.');
  const g = { id: uid(), homeId, awayId, created: Date.now(), status: 'live', events: [] };
  db.games.push(g); saveGame(g);
  location.hash = `#/game/${g.id}`;
}

// ---------- Live tracker ----------
const ui = { gameId: null, teamId: null, playerId: null };

// The latest plays, newest first (used by the tracker and the live box score).
function playLog(g, limit, emptyText) {
  const recent = g.events.slice(-limit).reverse(), half = halftimeScore(g);
  const mins = e => `${Math.max(0, Math.floor((e.t - g.created) / 60000))}'`;
  if (!recent.length) return `<div class="muted">${emptyText}</div>`;
  const who = id => (id ? esc(pname(id)) : '<span class="muted">unknown</span>');
  const detail = e => {
    switch (e.type) {
      case 'pass': return `${who(e.playerId)} <span class="muted">→</span> ${who(e.targetId)}`;
      case 'pull': return `${who(e.playerId)}${e.detail?.ob ? ' <span class="muted">(out of bounds)</span>' : ''}`;
      case 'goal': case 'drop': return `${who(e.playerId)}${e.assistId ? ` <span class="muted">from ${who(e.assistId)}</span>` : ''}`;
      default: return who(e.playerId);
    }
  };
  return `<ul class="log">${recent.map(e => e.type === 'half' ? `
    <li><span class="time">${mins(e)}</span>
      <span><span class="tag half">Halftime</span> ${half[0]}–${half[1]}</span></li>` : `
    <li><span class="time">${mins(e)}</span>
      <span><span class="dot" style="background:${team(e.teamId)?.color || '#888'}"></span>
      <span class="tag ${e.type}">${LABEL[e.type]}</span> ${detail(e)}</span></li>`).join('')}
  </ul>`;
}

// League setting: how many players each team has on the field at once.
const onFieldMax = () => db.settings?.onField || 7;

// A team's roster split into who's on the field and who's on the bench for this game.
// With no lineup set, everyone counts as "on" so nothing is hidden.
function splitRoster(g, tid, excludeId) {
  const players = team(tid).players.filter(p => p.id !== excludeId);
  const lineup = g.lineup?.[tid];
  if (!lineup) return { on: players, bench: [], hasLineup: false };
  return { on: players.filter(p => lineup.includes(p.id)), bench: players.filter(p => !lineup.includes(p.id)), hasLineup: true };
}

// Buttons for a player picker pop-up: on-field players first, then the bench.
function pickerButtons(tid, excludeId, onclick) {
  const { on, bench } = splitRoster(game(ui.gameId), tid, excludeId);
  const btn = p => `<button onclick="${onclick(p.id)}">#${esc(p.number)} ${esc(p.name)}</button>`;
  return on.map(btn).join('') + (bench.length
    ? `<div class="full muted divider">Bench</div>${bench.map(btn).join('')}` : '');
}

// Where a game is up to, worked out from its plays (so Undo only has to remove the last play):
//   choose → nobody has pulled yet;  pull → between points;  pickup → a team needs to pick up the disc;
//   possession → someone has the disc.
function gameState(g) {
  const other = t => (t === g.homeId ? g.awayId : g.homeId);
  const s = { phase: g.firstPull ? 'pull' : 'choose', pulling: g.firstPull || null, offense: null, holder: null, passes: 0, point: 1 };
  for (const e of g.events) {
    switch (e.type) {
      case 'pull': s.phase = 'pickup'; s.pulling = e.teamId; s.offense = other(e.teamId); s.holder = null; break;
      case 'pickup': s.phase = 'possession'; s.offense = e.teamId; s.holder = e.playerId; s.passes = 0; break;
      case 'pass': s.holder = e.targetId; s.passes++; break;
      case 'throwaway': case 'drop': case 'stall':
        s.phase = 'pickup'; s.offense = other(e.teamId); s.holder = null; break;
      case 'goal': case 'callahan':   // the team that scored pulls next
        s.phase = 'pull'; s.pulling = e.teamId; s.offense = null; s.holder = null; s.point++; break;
      case 'half':                    // teams swap: whoever received to start the game pulls to start the second half
        s.phase = 'pull'; s.pulling = g.firstPull ? other(g.firstPull) : s.pulling; s.offense = null; s.holder = null; break;
    }
  }
  s.defense = s.offense ? other(s.offense) : null;
  if (s.phase === 'pull') s.receiving = other(s.pulling);
  return s;
}

function renderTracker(g) {
  ui.gameId = g.id;
  const h = team(g.homeId), a = team(g.awayId), half = halftimeScore(g);
  if (!db.passReady) {
    app.innerHTML = `<h1>${esc(h.name)} vs ${esc(a.name)}</h1>
      <p class="msg error">Pass-by-pass tracking needs a database update. In Supabase, run <code>supabase/005_pass_by_pass.sql</code> in the SQL Editor, then reload.</p>`;
    return;
  }
  const st = gameState(g), stats = analyze([g]);
  const showTid = st.phase === 'pull' ? st.pulling : st.offense;
  if (showTid) ui.teamId = showTid;   // the lineup pop-up opens on this team
  const btn = onclick => p => {
    const s = statsOf(stats, p.id);
    return `<button class="player" onclick="${onclick(p.id)}">
      <span class="num">#${esc(p.number)}</span>${esc(p.name)}<span class="line">${s.pp}PP · ${s.g}G ${s.a}A ${s.d}D ${s.to}TO</span></button>`;
  };
  // Players on the field, then `between` (e.g. the Goal/Throwaway buttons), then the bench.
  const grid = (tid, onclick, excludeId, between = '') => {
    const r = splitRoster(g, tid, excludeId), t = team(tid);
    return `<div class="players" style="--team:${t.color}">${r.on.map(btn(onclick)).join('')}</div>${between}
      ${r.bench.length ? `<div class="muted" style="margin:14px 0 8px">Bench</div>
        <div class="players bench" style="--team:${t.color}">${r.bench.map(btn(onclick)).join('')}</div>` : ''}`;
  };
  const lineupBar = tids => `<div class="row lineup-bar">
    <span class="muted">${tids.map(tid => { const r = splitRoster(g, tid);
      return `${esc(team(tid).name)}: <b>${r.hasLineup ? `${r.on.length}/${onFieldMax()}` : 'no lineup'}</b>`; }).join(' · ')}</span>
    <button class="small" onclick="openLineup()">👥 Lineup</button></div>`;
  const dot = t => `<span class="dot" style="background:${t.color}"></span>`;

  let panel = '';
  if (st.phase === 'choose') {
    panel = `<div class="card phase">
      <div class="phase-head">Who pulls first?</div>
      <div class="muted">Set each team’s lineup first if you can. It’s used for points played and O/D stats.</div>
      <div class="tabs" style="margin-top:12px">${[h, a].map(x =>
        `<button style="border-color:${x.color}" onclick="setFirstPull('${x.id}')">${dot(x)}${esc(x.name)}</button>`).join('')}</div>
    </div>${lineupBar([h.id, a.id])}`;
  } else if (st.phase === 'pull') {
    const D = team(st.pulling), O = team(st.receiving);
    panel = `<div class="phase-head">Point ${st.point} · ${dot(D)}${esc(D.name)} pull <span class="muted">to ${esc(O.name)}</span></div>
      ${lineupBar([D.id, O.id])}
      <div class="muted" style="margin-bottom:8px">Tap who pulled.</div>
      ${grid(D.id, id => `pullSheet('${id}')`)}
      <button class="small" style="margin-top:10px" onclick="pullSheet(null)">Pulled, not sure who</button>`;
  } else if (st.phase === 'pickup') {
    const O = team(st.offense);
    panel = `<div class="phase-head">${dot(O)}${esc(O.name)} have the disc</div>
      <div class="muted" style="margin-bottom:8px">Tap who picked it up.</div>
      ${grid(O.id, id => `recordPickup('${id}')`)}`;
  } else {
    const O = team(st.offense), holder = player(st.holder);
    panel = `<div class="holder card" style="--team:${O.color}">
        🥏 <b>#${esc(holder.number)} ${esc(holder.name)}</b> has the disc
        <span class="muted">· ${esc(O.name)} · ${st.passes} pass${st.passes === 1 ? '' : 'es'}</span></div>
      <div class="muted" style="margin-bottom:8px">Tap who caught the pass.</div>
      ${grid(O.id, id => `recordPass('${id}')`, st.holder, `
      <div class="play-actions">
        <button class="goal" onclick="goalSheet()">Goal…</button>
        <button class="to" onclick="throwawaySheet()">Throwaway…</button>
        <button class="to" onclick="dropSheet()">Drop…</button>
        <button onclick="recordStall()">Stall</button>
      </div>`)}`;
  }

  app.innerHTML = `
    <div class="card scoreboard">
      <div class="team" style="color:${h.color}">${esc(h.name)}</div>
      <div>
        <div class="nums">${score(g, h.id)}–${score(g, a.id)}</div>
        <div class="muted">${half ? `2nd half · HT ${half[0]}–${half[1]}` : '1st half'}</div>
      </div>
      <div class="team" style="color:${a.color}">${esc(a.name)}</div>
    </div>
    ${panel}
    <h2>Recent plays</h2>
    <div class="card">${playLog(g, 6, 'Plays will show up here.')}</div>
    <div class="row">
      <button onclick="undo()" ${g.events.length ? '' : 'disabled'}>↶ Undo</button>
      <a class="btn" href="#/box/${g.id}">Box score</a>
      ${!half && st.phase === 'pull' && st.point > 1 ? '<button onclick="halftime()">Halftime</button>' : ''}
      <button class="primary" onclick="endGame()">End game</button>
    </div>`;
}

// ---------- Lineup ----------
// A draft of both teams' lineups while the pop-up is open; saved to the game on Done.
let lineupDraft = null, lineupTeam = null;

function openLineup() {
  const g = game(ui.gameId);
  lineupDraft = { [g.homeId]: [...(g.lineup?.[g.homeId] || [])], [g.awayId]: [...(g.lineup?.[g.awayId] || [])] };
  // Open on the team currently shown, or the home team (ui.teamId can be left over from another game).
  lineupTeam = ui.teamId === g.awayId ? g.awayId : g.homeId;
  renderLineup();
}

function renderLineup(msg = '') {
  const g = game(ui.gameId), max = onFieldMax(), sel = lineupDraft[lineupTeam], t = team(lineupTeam);
  openSheet(`
    <h3>Lineup</h3>
    <div class="tabs">${[g.homeId, g.awayId].map(tid => {
      const x = team(tid), on = tid === lineupTeam;
      return `<button class="${on ? 'on' : ''}" style="border-color:${x.color};${on ? 'background:' + x.color : ''}"
        onclick="lineupTeam = '${tid}'; renderLineup()">${esc(x.name)} (${lineupDraft[tid].length})</button>`;
    }).join('')}</div>
    <div class="muted">Tap players to put them in or take them out.
      <b style="color:var(--text)">${sel.length} / ${max}</b> on the field.</div>
    <div class="msg error">${esc(msg)}</div>
    <div class="actions lineup">${t.players.map(p => `
      <button class="${sel.includes(p.id) ? 'in' : ''}" onclick="toggleLineup('${p.id}')">
        ${sel.includes(p.id) ? '✓ ' : ''}#${esc(p.number)} ${esc(p.name)}</button>`).join('')}
    </div>
    <div class="actions" style="margin-top:12px">
      <button onclick="lineupDraft[lineupTeam] = []; renderLineup()">Clear ${esc(t.name)}</button>
      <button class="goal" onclick="saveLineup()">Done</button>
      <button class="full" onclick="closeSheet()">Cancel</button>
    </div>`);
}

function toggleLineup(pid) {
  const sel = lineupDraft[lineupTeam], i = sel.indexOf(pid);
  if (i >= 0) sel.splice(i, 1);
  else if (sel.length >= onFieldMax()) return renderLineup(`Only ${onFieldMax()} players can be on the field. Take someone out first.`);
  else sel.push(pid);
  renderLineup();
}

function saveLineup() {
  const g = game(ui.gameId);
  for (const tid of [g.homeId, g.awayId]) {
    if (lineupDraft[tid].length > onFieldMax()) {
      lineupTeam = tid;
      return renderLineup(`${team(tid).name} has more than ${onFieldMax()} players on the field.`);
    }
  }
  // An empty lineup means "not set", so the whole roster is shown again.
  const midPoint = eventsThisPoint(g).some(e => e.type !== 'half');
  g.lineup = {};
  g.pointPlayers = g.pointPlayers || {};
  for (const tid of [g.homeId, g.awayId]) {
    const lineup = lineupDraft[tid].length ? lineupDraft[tid] : null;
    g.lineup[tid] = lineup;
    // A sub during a point means both players played it; a change between points just replaces the lineup.
    g.pointPlayers[tid] = midPoint
      ? [...new Set([...(g.pointPlayers[tid] || []), ...(lineup || [])])]
      : [...(lineup || [])];
  }
  saveGame(g); route();
}

// ---------- Points played ----------
// Plays since the last goal, newest first.
function eventsThisPoint(g) {
  const out = [];
  for (let i = g.events.length - 1; i >= 0; i--) {
    const e = g.events[i];
    if (e.type === 'goal' || e.type === 'callahan') break;
    out.push(e);
  }
  return out;
}

// Who played the point that's ending, per team. Only teams with a lineup set are counted.
// Anyone who recorded a stat this point also played it, even if they weren't in the lineup.
function pointSnapshot(g, scoringPlay) {
  const played = {};
  const plays = [...eventsThisPoint(g), scoringPlay];
  for (const tid of [g.homeId, g.awayId]) {
    const lineup = g.lineup?.[tid];
    if (!lineup) continue;
    const ids = new Set([...(g.pointPlayers?.[tid] || []), ...lineup]);
    for (const e of plays) if (e.teamId === tid) {
      for (const id of [e.playerId, e.assistId, e.targetId]) if (id) ids.add(id);
    }
    played[tid] = [...ids];
  }
  return played;
}

function halftime() {
  const g = game(ui.gameId);
  if (!confirm(`Mark halftime at ${score(g, g.homeId)}–${score(g, g.awayId)}?`)) return;
  const e = { id: uid(), t: Date.now(), type: 'half' };
  g.events.push(e); saveEvent(g, e);
  route();
}

// ----- Recording plays -----
// Plays recorded together (a throwaway and its block) share a group id, so one Undo removes both.
function play(type, fields = {}) {
  const g = game(ui.gameId), e = { id: uid(), t: Date.now(), type, ...fields };
  g.events.push(e); saveEvent(g, e);
  return e;
}
const stateNow = () => gameState(game(ui.gameId));

function setFirstPull(tid) {
  const g = game(ui.gameId);
  g.firstPull = tid; saveGame(g); route();
}

function pullSheet(pid) {
  openSheet(`
    <h3>Pull${pid ? ` by ${esc(pname(pid))}` : ''}</h3>
    <div class="actions">
      <button class="goal" onclick="recordPull(${pid ? `'${pid}'` : 'null'}, false)">In bounds</button>
      <button class="to" onclick="recordPull(${pid ? `'${pid}'` : 'null'}, true)">Out of bounds</button>
      <button class="full" onclick="closeSheet()">Cancel</button>
    </div>`);
}

function recordPull(pid, ob) {
  play('pull', { teamId: stateNow().pulling, playerId: pid, ...(ob ? { detail: { ob: true } } : {}) });
  route();
}

function recordPickup(pid) { play('pickup', { teamId: stateNow().offense, playerId: pid }); route(); }

function recordPass(pid) {
  const st = stateNow();
  play('pass', { teamId: st.offense, playerId: st.holder, targetId: pid });
  route();
}

// A goal or callahan ends the point: note who played it, and start the next point with the current lineup.
function endPoint(type, fields) {
  const g = game(ui.gameId);
  fields.played = pointSnapshot(g, fields);
  g.pointPlayers = { [g.homeId]: [...(g.lineup?.[g.homeId] || [])], [g.awayId]: [...(g.lineup?.[g.awayId] || [])] };
  play(type, fields);
  saveGame(g);
}

function goalSheet() {
  const st = stateNow();
  openSheet(`
    <h3>Goal! Who caught it? <span class="muted">(thrown by ${esc(player(st.holder).name)})</span></h3>
    <div class="actions">
      ${pickerButtons(st.offense, st.holder, id => `recordGoal('${id}')`)}
      <button class="full" onclick="closeSheet()">Cancel</button>
    </div>`);
}

function recordGoal(pid) {
  const st = stateNow();
  endPoint('goal', { teamId: st.offense, playerId: pid, assistId: st.holder });
  route();
}

function dropSheet() {
  const st = stateNow();
  openSheet(`
    <h3>Drop. Who dropped ${esc(player(st.holder).name)}’s throw?</h3>
    <div class="actions">
      ${pickerButtons(st.offense, st.holder, id => `recordDrop('${id}')`)}
      <button class="full" onclick="closeSheet()">Cancel</button>
    </div>`);
}

function recordDrop(pid) {
  const st = stateNow();
  play('drop', { teamId: st.offense, playerId: pid, assistId: st.holder });
  route();
}

function throwawaySheet() {
  const st = stateNow(), def = team(st.defense);
  openSheet(`
    <h3>Throwaway by ${esc(player(st.holder).name)}</h3>
    <div class="actions">
      <button class="full" onclick="recordThrowaway(null)">Not blocked</button>
      <div class="full muted divider">Blocked by ${esc(def.name)}:</div>
      ${pickerButtons(def.id, null, id => `recordThrowaway('${id}')`)}
      <button class="full d" onclick="callahanSheet()">Callahan (caught in the end zone for a goal)…</button>
      <button class="full" onclick="closeSheet()">Cancel</button>
    </div>`);
}

function recordThrowaway(blockerId) {
  const st = stateNow(), grp = uid();
  play('throwaway', { teamId: st.offense, playerId: st.holder, detail: { grp } });
  if (blockerId) play('d', { teamId: st.defense, playerId: blockerId, detail: { grp } });
  route();
}

function callahanSheet() {
  const st = stateNow(), def = team(st.defense);
  openSheet(`
    <h3>Callahan! Who caught it for ${esc(def.name)}?</h3>
    <div class="actions">
      ${pickerButtons(def.id, null, id => `recordCallahan('${id}')`)}
      <button class="full" onclick="throwawaySheet()">← Back</button>
    </div>`);
}

function recordCallahan(pid) {
  const st = stateNow(), grp = uid();
  play('throwaway', { teamId: st.offense, playerId: st.holder, detail: { grp } });
  endPoint('callahan', { teamId: st.defense, playerId: pid, detail: { grp } });
  route();
}

function recordStall() {
  const st = stateNow();
  play('stall', { teamId: st.offense, playerId: st.holder });
  route();
}

// Words for a play, e.g. "Pass Jordan → Sam".
function describePlay(e) {
  const n = id => (id ? player(id).name : 'someone');
  switch (e.type) {
    case 'pass': return `Pass ${n(e.playerId)} → ${n(e.targetId)}`;
    case 'pull': return `Pull${e.playerId ? ` by ${n(e.playerId)}` : ''}${e.detail?.ob ? ' (out of bounds)' : ''}`;
    case 'pickup': return `Pickup by ${n(e.playerId)}`;
    case 'goal': return `Goal ${n(e.playerId)}${e.assistId ? ` from ${n(e.assistId)}` : ''}`;
    case 'drop': return `Drop by ${n(e.playerId)}`;
    case 'half': return 'Halftime';
    default: return `${LABEL[e.type]} ${n(e.playerId)}`;
  }
}

// Undo the last play (or the last group of plays recorded together). No confirmation: it's a quick fix
// that's easy to redo, and the message says what was removed.
function undo() {
  const g = game(ui.gameId), last = g.events.at(-1);
  if (!last) return;
  const grp = last.detail?.grp, batch = [];
  for (let i = g.events.length - 1; i >= 0; i--) {
    if (batch.length && !(grp && g.events[i].detail?.grp === grp)) break;
    batch.push(g.events[i]);
  }
  g.events.length -= batch.length;
  const ids = batch.map(e => e.id);
  persist(() => sb.from('events').delete().in('id', ids));
  const ended = batch.find(e => e.played);
  if (ended) { g.pointPlayers = ended.played; saveGame(g); } // back in the point that play ended
  toast(`Undone: ${batch.reverse().map(describePlay).join(' + ')}`);
  route();
}

function endGame() {
  if (!confirm('End this game and mark it final?')) return;
  const g = game(ui.gameId);
  g.status = 'final'; saveGame(g);
  location.hash = `#/box/${ui.gameId}`;
}

function openSheet(html) {
  sheet.innerHTML = `<div class="backdrop" onclick="closeSheet()"></div><div class="panel">${html}</div>`;
  sheet.classList.add('open');

function closeSheet() {
  sheet.classList.remove('open'); sheet.innerHTML = '';

// ---------- Stat tables ----------
function statTable(rows, cols, sortKey, onSortName) {
  return `<div class="table-wrap"><table>
    <thead><tr>${cols.map(c => `<th class="${c.l ? 'l' : ''} ${c.k === sortKey ? 'sorted' : ''}" ${c.title ? `title="${esc(c.title)}"` : ''}
      ${onSortName && c.sort !== false ? `onclick="${onSortName}('${c.k}')"` : ''}>${c.h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.userId && r.userId === me() ? 'me' : ''}">${cols.map(c => `<td class="${c.l ? 'l' : ''}">${c.f ? c.f(r) : r[c.k]}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

// Highest first; names A–Z; stats that can't be calculated (null) go last.
function sortRows(rows, key) {
  return rows.sort((x, y) => {
    if (key === 'name') return x.name.localeCompare(y.name);
    const a = x[key], b = y[key];
    if (a == null || b == null) return (a == null) - (b == null);
    return b - a || (y.pm ?? 0) - (x.pm ?? 0);
  });
}

// Keep the sort column valid for the current stat category.
function sortKeyFor(key) {
  const keys = STAT_CATS[statCat].cols.map(c => c[0]);
  return key === 'name' || keys.includes(key) ? key : keys[0];
}

const playerNameCol = (showTeam = true) => ({
  k: 'name', h: 'Player', l: true,
  f: r => `<a href="#/profile/${r.id}" style="color:inherit">${showTeam ? `<span class="dot" style="background:${r.team.color}"></span>` : `<span class="muted">#${esc(r.number)}</span> `}${esc(r.name)}</a>`
});
const statFootnote = '<p class="muted foot">* Can’t be calculated yet (for example, no pass-by-pass games). +/- = goals + assists + Ds − drops − throwaways − stalls. Hover a column name to see what it means.</p>';

// ---------- Box score (a game's page) ----------
let boxTab = 'stats', boxSort = 'pm';
function sortBox(k) { boxSort = k; route(); }

function renderBox(g) {
  const an = analyze([g]), r = an.games[0] || analyzeGame(g);
  const h = team(g.homeId), a = team(g.awayId), half = halftimeScore(g);

  boxSort = sortKeyFor(boxSort);
  const rowsFor = t => sortRows(t.players.map(p => ({ ...p, team: t, ...statsOf(an, p.id) })), boxSort);

  // Game leaders: the top player in a few headline stats.
  const everyone = [...rowsFor(h), ...rowsFor(a)];
  const leaders = [['g', 'Goals'], ['a', 'Assists'], ['d', 'Ds'], ['pm', 'Plus/minus'], ['taT', 'Throwaways'], ['tou', 'Touches']].map(([k, label]) => {
    const best = Math.max(0, ...everyone.map(p => p[k] || 0));
    const who = everyone.filter(p => best > 0 && p[k] === best);
    return who.length ? [label, `${who.map(p => p.name).slice(0, 3).join(', ')}${who.length > 3 ? '…' : ''} (${best})`] : null;
  }).filter(Boolean);

  const statsTab = `

    ${statCatTabs('route()')}
    ${[h, a].map(t => `<h2><span class="dot" style="background:${t.color}"></span>${esc(t.name)} · ${score(g, t.id)}</h2>
      <div class="card">${statTable(rowsFor(t), statCols(playerNameCol(false)), boxSort, 'sortBox')}</div>`).join('')}

  const pointsTab = r.points.length ? `<div class="card">${r.points.map((p, i) => {
    const t = team(p.scorer), how = p.type === 'callahan' ? 'Callahan' : p.pulling ? (p.scorer === p.receiving ? 'Hold' : 'Break') : 'Goal';
    const secs = p.pulling ? Math.max(0, Math.round((p.end - p.start) / 1000)) : null;
    const on = tid => (p.played?.[tid] || []).map(id => player(id).name).join(', ');
    return `<div class="point-row">
      <div class="point-head"><span class="muted">#${i + 1}</span>
        <b>${esc(h.name)} ${p.score[0]}–${p.score[1]} ${esc(a.name)}</b>
        <span class="badge ${how === 'Break' || how === 'Callahan' ? 'live' : ''}">${how.toUpperCase()}</span></div>
      <div><span class="dot" style="background:${t.color}"></span>${esc(t.name)} scored
        ${p.scorerId ? `· ${esc(player(p.scorerId).name)}${p.assistId ? ` from ${esc(player(p.assistId).name)}` : ''}` : ''}</div>
      <div class="muted">${[p.pulling ? `${esc(team(p.pulling).name)} pulled` : '', secs != null ? `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}` : '',
        r.tracked ? `${p.throws} throws` : '', `${p.turns} turnover${p.turns === 1 ? '' : 's'}`].filter(Boolean).join(' · ')}</div>
      ${p.played ? `<div class="muted on-field">${[h, a].filter(x => on(x.id)).map(x => `${esc(x.name)}: ${esc(on(x.id))}`).join('<br>')}</div>` : ''}
    </div>`;
  }).join('')}</div>` : '<p class="muted">No points played yet.</p>';

  app.innerHTML = `
    ${live ? `
    <div class="card scoreboard live-board">
      <div class="team" style="color:${h.color}">${esc(h.name)}</div>
      <div>
        <div class="muted"><span class="live-dot"></span><b style="color:var(--bad)">LIVE</b></div>
        <div class="nums">${score(g, h.id)}–${score(g, a.id)}</div>
        <div class="muted">${half ? `2nd half · HT ${half[0]}–${half[1]}` : '1st half'}</div>
      </div>
      <div class="team" style="color:${a.color}">${esc(a.name)}</div>
    </div>
    <p class="muted" style="text-align:center;margin-top:-4px">Updates automatically as plays are recorded.</p>
    <h2>Recent plays</h2><div class="card">${playLog(g, 8, 'No plays yet.')}</div>` : `
    <div class="row" style="justify-content:space-between">
      <h1 style="flex:1">${esc(h.name)} ${score(g, h.id)} – ${score(g, a.id)} ${esc(a.name)}</h1>
      <span class="badge ${g.status}" style="flex:0 0 auto">${STATUS[g.status]}</span>
    </div>
    <div class="muted">${new Date(g.created).toLocaleString()}${half ? ` · Halftime ${half[0]}–${half[1]}` : ''}</div>`}
    <div class="tabs leader-tabs" style="margin-top:14px">
      <button class="${boxTab === 'stats' ? 'on' : ''}" onclick="boxTab = 'stats'; route()">Stats</button>
      <button class="${boxTab === 'points' ? 'on' : ''}" onclick="boxTab = 'points'; route()">Points</button>
    </div>
    ${boxTab === 'points' ? pointsTab : statsTab}
    ${isAdmin() ? `<div class="row">
      ${g.status === 'live'
        ? `<a class="btn primary" href="#/game/${g.id}">Back to tracking</a>`
        : `<button onclick="reopen('${g.id}')">Reopen game</button>`}
      <button onclick="deleteGame('${g.id}')">Delete game</button>
    </div>` : ''}`;
}

function reopen(id) { const g = game(id); g.status = 'live'; saveGame(g); location.hash = `#/game/${id}`; }
function deleteGame(id) {
  if (!confirm('Delete this game and all its stats? This cannot be undone.')) return;
  db.games = db.games.filter(g => g.id !== id);
  persist(() => sb.from('games').delete().eq('id', id));
  location.hash = '#/games';
}

let editing = null;

function renderTeams() {

function teamCard(t) {
  return `

function teamEditor(t) {
  return `
    <div class="card" style="border:2px solid var(--accent)">
      <div class="muted" style="margin-bottom:6px">Team name and colour</div>
      <div class="row">
        <input value="${esc(t.name)}" placeholder="Team name" maxlength="40" oninput="editing.name = this.value">
        <input type="color" value="${esc(t.color)}" oninput="editing.color = this.value">
      </div>
      <div class="muted" style="margin:16px 0 6px">Players</div>

        <li class="row">
          <input value="${esc(p.number)}" placeholder="#" inputmode="numeric" style="flex:0 0 64px"

        </li>`).join('')}
      </ul>
      <div class="row">
        <input id="new-num" placeholder="#" inputmode="numeric" style="flex:0 0 64px">
        <input id="new-name" placeholder="New player name" onkeydown="if (event.key === 'Enter') draftAddPlayer()">
        <button class="small" onclick="draftAddPlayer()">Add</button>
      </div>
      <div class="row" style="margin-top:18px">

function editTeam(id) {
  if (editing && editing.id !== id && !confirm(`Discard your unsaved changes to ${team(editing.id).name}?`)) return;
  editing = structuredClone(team(id));
  renderTeams();
}

function draftAddPlayer() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) return;
  editing.players.push({ id: uid(), name, number: document.getElementById('new-num').value.trim() });
  renderTeams();
  document.getElementById('new-num').focus();
}

function draftRemovePlayer(i) {
  const pid = editing.players[i].id;
  const used = db.games.some(g => g.events.some(e => e.playerId === pid || e.assistId === pid));
  if (used) return alert('This player has recorded stats, so they can’t be removed. You can still rename them.');
  editing.players.splice(i, 1);
  renderTeams();
}

function saveTeam() {
  editing.name = editing.name.trim();
  editing.players.forEach(p => { p.name = p.name.trim(); p.number = String(p.number).trim(); });
  if (!editing.name) return alert('The team needs a name.');
  if (editing.players.some(p => !p.name)) return alert('Every player needs a name.');
  const i = db.teams.findIndex(t => t.id === editing.id);
  if (i < 0) { editing = null; renderTeams(); return alert('Another admin deleted this team, so your changes weren’t saved.'); }
  const t = editing, removed = db.teams[i].players.filter(p => !t.players.some(x => x.id === p.id)).map(p => p.id);
  const row = teamRow(t), rows = playerRows(t);
  db.teams[i] = t;
  persist(steps(
    () => sb.from('teams').upsert(row),
    ...(rows.length ? [() => sb.from('players').upsert(rows)] : []),
    ...(removed.length ? [() => sb.from('players').delete().in('id', removed)] : [])
  ));
  editing = null; renderTeams();
}

function cancelEdit() { editing = null; renderTeams(); }

function deleteTeam() {
  const id = editing.id;
  if (db.games.some(g => g.homeId === id || g.awayId === id))
    return alert('This team has games (played or scheduled), so it can’t be deleted. You can still rename it.');
  if (!confirm(`Delete ${team(id).name} and its roster?`)) return;
  db.teams = db.teams.filter(t => t.id !== id);
  persist(() => sb.from('teams').delete().eq('id', id)); // its players are removed with it
  editing = null; renderTeams();
}

function addTeam() {
  const n = document.getElementById('tn').value.trim();
  if (!n) return;
  const t = { id: uid(), name: n, color: document.getElementById('tc').value, players: [] };
  db.teams.push(t);
  const row = teamRow(t);
  persist(() => sb.from('teams').upsert(row));
  editing = structuredClone(t); // open the new team straight away so players can be added
  renderTeams();
  document.getElementById('new-name').focus();
}

function resetAll() {
  if (!confirm(`Erase all teams, games and stats in ${league.name} and replace them with sample teams?`)) return;
  const leagueId = league.id, fresh = seed();
  db = { ...fresh, settings: db.settings }; editing = null;
  const teams = fresh.teams.map(teamRow), players = fresh.teams.flatMap(playerRows);
  persist(steps(
    () => sb.from('games').delete().eq('league_id', leagueId),   // plays are removed with their games
    () => sb.from('teams').delete().eq('league_id', leagueId),   // players are removed with their teams
    () => sb.from('teams').upsert(teams),
    () => sb.from('players').upsert(players)
  ));
  location.hash = '#/games'; route();
}

// ---------- Sign in / sign up ----------
const authUrl = () => location.origin + location.pathname;

function renderLogin() {
  const up = authMode === 'signup';
  app.innerHTML = `
    <div class="card auth">
      <h1>${up ? 'Create an account' : 'Sign in'}</h1>
      <form onsubmit="submitAuth(event)">
        <input id="email" type="email" autocomplete="email" placeholder="Email" required>
        <input id="pw" type="password" autocomplete="${up ? 'new-password' : 'current-password'}"
          placeholder="Password${up ? ' (6+ characters)' : ''}" minlength="6" required>
        <button class="primary" id="authBtn">${up ? 'Create account' : 'Sign in'}</button>
      </form>
      <div id="authMsg" class="msg"></div>
      <div class="links">
        <a onclick="authMode='${up ? 'signin' : 'signup'}';renderLogin()">${up ? 'Have an account? Sign in' : 'New here? Create an account'}</a>
        ${up ? '' : '<a onclick="forgotPassword()">Forgot password?</a>'}
      </div>
    </div>`;
}

function authMsg(text, isError) {
  const m = document.getElementById('authMsg');
  m.textContent = text; m.classList.toggle('error', !!isError);
}

async function submitAuth(ev) {
  ev.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('pw').value;
  const btn = document.getElementById('authBtn');
  btn.disabled = true; authMsg('');
  const { data, error } = authMode === 'signup'
    ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: authUrl() } })
    : await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if (error) return authMsg(error.message, true);
  // If email confirmation is on, sign-up returns no session until the link is clicked.
  if (authMode === 'signup' && !data.session) authMsg('Check your email for a confirmation link, then sign in.');
}

async function forgotPassword() {
  const email = document.getElementById('email').value.trim();
  if (!email) return authMsg('Type your email above first.', true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: authUrl() });
  authMsg(error ? error.message : 'If that email has an account, a reset link is on its way.', !!error);
}

function renderNewPassword() {
  app.innerHTML = `
    <div class="card auth">
      <h1>Choose a new password</h1>
      <form onsubmit="saveNewPassword(event)">
        <input id="pw" type="password" autocomplete="new-password" placeholder="New password (6+ characters)" minlength="6" required>
        <button class="primary">Save password</button>
      </form>
      <div id="authMsg" class="msg"></div>
    </div>`;
}

async function saveNewPassword(ev) {
  ev.preventDefault();
  const { error } = await sb.auth.updateUser({ password: document.getElementById('pw').value });
  if (error) return authMsg(error.message, true);
  recovering = false; route();
}

async function signOut() {
  if (confirm('Sign out on this device?')) await sb.auth.signOut();
}

function renderSetup() {
  app.innerHTML = `
    <div class="card auth">
      <h1>Almost ready</h1>
      <p>Sign-in needs a Supabase project. Open <code>index.html</code> and fill in
      <code>SUPABASE_URL</code> and <code>SUPABASE_KEY</code> near the top of the script.</p>
      ${window.supabase ? '' : '<p class="msg error">The Supabase library didn’t load — check your internet connection.</p>'}
    </div>`;
}

if (sb) {
  // Fires once on load with any saved session, then on every sign in / sign out.
  sb.auth.onAuthStateChange((event, s) => {
    session = s; authReady = true;
    if (event === 'PASSWORD_RECOVERY') recovering = true;
    if (event === 'SIGNED_OUT') { leaveLeague(); location.hash = '#/'; }
    setTimeout(route); // don't call Supabase from inside this callback
  });
}
route();
</script>
</body>
</html>
