<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Frisbee Stats</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #6b7280;
    --line: #e3e5ea; --accent: #ff6a1a; --accent-text: #ffffff;
    --good: #16a34a; --bad: #dc2626; --d: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #1a1d24; --text: #eef0f4; --muted: #9aa1ad;
      --line: #2a2f39; --accent: #ff7a2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--card);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  }
  header .logo { font-weight: 800; margin-right: auto; color: var(--text); padding: 6px 0; }
  header .logo span { color: var(--accent); }
  #modeTag { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-left: 4px; }
  body.player .admin-only { display: none; }
  body.no-nav header a[data-nav] { display: none; }
  header a { color: var(--muted); text-decoration: none; font-weight: 600; padding: 6px 10px; border-radius: 8px; }
  header a.on { color: var(--text); background: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 14px; }
  h2 { font-size: 17px; margin: 22px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 0; }
  .row > .small { flex: 0 0 auto; }
  button, .btn {
    font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 14px;
    background: var(--bg); color: var(--text); cursor: pointer; text-decoration: none;
    display: inline-block; text-align: center; border: 1px solid var(--line);
  }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  button.danger { color: var(--bad); }
  .danger-zone { border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .danger-zone .row > span { flex: 1; }
  button.small, .btn.small { padding: 6px 10px; font-size: 14px; border-radius: 8px; white-space: nowrap; }
  button:active { transform: scale(0.97); }
  select, input {
    font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); width: 100%;
  }
  input[type=color] { padding: 2px; height: 46px; width: 56px; flex: 0 0 56px; }
  .game-link { display: flex; justify-content: space-between; align-items: center; color: inherit; text-decoration: none; }
  .badge { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 99px; background: var(--line); }
  .badge.live { background: var(--bad); color: #fff; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  /* Scoreboard */
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; padding: 14px 8px; }
  .scoreboard .team { font-weight: 700; font-size: 15px; }
  .scoreboard .nums { font-size: 40px; font-weight: 900; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .tabs button { border-width: 2px; }
  .tabs button.on { color: #fff; }
  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .player {
    text-align: left; padding: 14px 12px; min-height: 72px; background: var(--card);
    /* A two-tone stripe for two-colour teams: the border is colour 1, an inset shadow colour 2. */
    border-left: 3px solid var(--team, var(--accent));
    box-shadow: inset 3px 0 0 var(--team2, var(--team, var(--accent)));
  }
  .player .num { color: var(--muted); font-weight: 800; margin-right: 4px; }
  .player .line { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .log { list-style: none; padding: 0; margin: 0; }
  .log li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; display: flex; gap: 8px; }
  .log li:last-child { border-bottom: 0; }
  .log .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tag { font-weight: 800; }
  .tag.goal, .tag.callahan { color: var(--good); }
  .tag.d { color: var(--d); }
  .tag.throwaway, .tag.drop { color: var(--bad); }
  .tag.half { color: var(--accent); }

  /* Bottom sheet */
  #sheet { display: none; }
  #sheet.open { display: block; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--card);
    border-radius: 18px 18px 0 0; padding: 18px 16px 24px; max-height: 80vh; overflow-y: auto;
    max-width: 720px; margin: 0 auto;
  }
  .panel h3 { margin: 0 0 14px; font-size: 18px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions button { padding: 18px 10px; font-size: 17px; }
  .actions .goal { background: var(--good); color: #fff; border: 0; }
  .actions .d { background: var(--d); color: #fff; border: 0; }
  .actions .to { background: var(--bad); color: #fff; border: 0; }
  .actions .full { grid-column: 1 / -1; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; cursor: pointer; user-select: none; }
  th.sorted { color: var(--accent); }
  .roster li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .roster { list-style: none; padding: 0; margin: 0 0 10px; }

  /* Sign in */
  body.signed-out header a[data-nav], body.signed-out #modeTag { display: none; }

  /* Main menu */
  .menu { display: grid; gap: 14px; margin-top: 10px; }
  .menu a {
    display: flex; gap: 16px; align-items: center; padding: 22px 18px; color: inherit; text-decoration: none;
    border-left: 6px solid var(--accent);
  }
  .menu a:active { transform: scale(0.98); }
  .menu .icon { font-size: 36px; }
  .menu b { font-size: 20px; display: block; margin-bottom: 2px; }
  .auth { max-width: 380px; margin: 40px auto 0; padding: 22px; }
  .auth form { display: grid; gap: 10px; margin-bottom: 10px; }
  .auth .links { display: flex; justify-content: space-between; margin-top: 14px; font-size: 14px; }
  .auth .links a { color: var(--accent); cursor: pointer; font-weight: 600; }
  .msg { font-size: 14px; min-height: 20px; }
  .msg.error { color: var(--bad); }
  code { background: var(--bg); padding: 1px 5px; border-radius: 5px; }

  /* League border editor */
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
  .preset { height: 38px; padding: 0; border-radius: 10px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .swatch { display: inline-flex; gap: 4px; align-items: center; }
  .swatch input[type=color] { width: 52px; height: 40px; padding: 2px; }
  .badge.scheduled { background: var(--d); color: #fff; }

  /* Schedule creator */
  .options { display: grid; gap: 10px; }
  .option { display: flex; gap: 12px; align-items: flex-start; padding: 14px; cursor: pointer; margin: 0; }
  .option input { width: auto; margin-top: 3px; accent-color: var(--accent); }
  .option:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .round h3 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .match { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .match:last-child { border-bottom: 0; }

  /* Lineup */
  .lineup-bar { margin-bottom: 10px; }
  .players.bench .player { opacity: .6; min-height: 56px; }
  .actions .divider { font-size: 13px; margin-top: 6px; }
  .actions button.in { background: var(--good); color: #fff; border-color: transparent; }

  /* Player claims and profiles */
  .claim-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .claim-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .badge.you { background: var(--good); color: #fff; }
  .claimed { font-size: 12px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; text-align: center; }
  .stat-grid b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .stat-grid span { font-size: 12px; }
  tr.me td { background: color-mix(in srgb, var(--good) 15%, transparent); }
  .scoreboard.live-board { position: relative; }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px;
    animation: pulse 1.4s ease-in-out infinite; vertical-align: middle; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* Chart colours: the first slots of a colourblind-validated palette, with their own dark-mode steps */
  :root { --series-1: #2a78d6; --series-2: #eb6834; --grid: #e1e0d9; --axis: #c3c2b7; --ink-muted: #898781; }
  @media (prefers-color-scheme: dark) {
    :root { --series-1: #3987e5; --series-2: #d95926; --grid: #2c2c2a; --axis: #383835; }
  }

  /* Pass-by-pass tracker */
  .phase-head { font-size: 18px; font-weight: 800; margin: 4px 0 10px; }
  .phase .tabs button { font-size: 16px; padding: 16px 10px; }
  .holder { font-size: 17px; border-left: 3px solid var(--team); box-shadow: inset 3px 0 0 var(--team2, var(--team)); }
  .play-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 4px; }
  .play-actions button { padding: 16px 10px; font-size: 16px; }
  .play-actions .goal { background: var(--good); color: #fff; border: 0; }
  .play-actions .to { background: var(--bad); color: #fff; border: 0; }
  .tag.pass, .tag.pickup { color: var(--muted); }
  .tag.pull { color: var(--d); }
  .tag.stall { color: var(--bad); }

  /* Stat categories, tiles and game pages */
  .cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 4px 0 10px; }
  .cat-tabs button { flex: 0 0 auto; padding: 7px 12px; font-size: 14px; border-radius: 99px; white-space: nowrap; }
  .cat-tabs button.on { background: var(--text); color: var(--bg); border-color: transparent; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .tile-label { font-size: 13px; color: var(--muted); }
  .tile b { font-size: 26px; font-weight: 700; }
  .tile-note { font-size: 12px; color: var(--muted); }
  .leaders-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .leaders-list div { display: flex; flex-direction: column; font-size: 14px; }
  .point-row { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .point-row:last-child { border-bottom: 0; }
  .point-head { display: flex; gap: 8px; align-items: center; margin-bottom: 2px; }
  .point-head b { flex: 1; }
  .on-field { font-size: 12px; margin-top: 4px; }
  .foot { font-size: 12px; }
  th[title] { text-decoration: underline dotted; text-underline-offset: 3px; }

  /* Charts */
  .chart { overflow: hidden; }
  .chart svg { display: block; margin-top: 8px; overflow: visible; }
  .chart-title { font-weight: 700; margin-bottom: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .swatch.series-1 { background: var(--series-1); } .swatch.series-2 { background: var(--series-2); }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .axis { stroke: var(--axis); stroke-width: 1; }
  .chart .guide { stroke: var(--axis); stroke-width: 1; }
  .chart .tick { fill: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .end-label, .chart .node-label { fill: var(--text); font-size: 12px; font-weight: 600; }
  .chart .in-label { fill: #fff; font-size: 12px; font-weight: 700; pointer-events: none; }
  .chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .line.series-1 { stroke: var(--series-1); } .chart .line.series-2 { stroke: var(--series-2); }
  .chart .dot { stroke: var(--card); stroke-width: 2; }
  .chart .dot.series-1, .chart .bar.series-1, .chart .node { fill: var(--series-1); }
  .chart .dot.series-2, .chart .bar.series-2 { fill: var(--series-2); }
  .chart .hit { fill: transparent; cursor: pointer; outline: none; }
  .chart .flow { fill: none; stroke: var(--ink-muted); stroke-opacity: .28; cursor: pointer; outline: none; }
  .chart .flow.lit { stroke: var(--series-1); stroke-opacity: .6; }
  .chart .node { cursor: pointer; outline: none; }
  /* Keyboard focus on a mark shows its tooltip (and guide line) rather than an outline that could be mistaken for data. */
  #chart-tip { position: fixed; z-index: 30; display: none; pointer-events: none; white-space: pre-line;
    background: var(--text); color: var(--bg); font-size: 13px; padding: 7px 10px; border-radius: 8px; max-width: 260px; }
  #chart-tip.show { display: block; }
  .table-twin { margin-top: 8px; font-size: 13px; }
  .table-twin summary { color: var(--muted); cursor: pointer; }
  .hbar { display: grid; grid-template-columns: minmax(70px, 30%) 1fr 28px; gap: 8px; align-items: center; font-size: 14px; padding: 4px 0; }
  .hbar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-track { height: 12px; }
  .hbar-track i { display: block; height: 100%; min-width: 4px; background: var(--series-1); border-radius: 0 4px 4px 0; }
  .hbar-val { text-align: right; font-variant-numeric: tabular-nums; }

  /* Header: four tabs and the bell have to fit on a phone */
  header { gap: 2px; padding: 8px 10px; }
  header a[data-nav] { padding: 6px 7px; font-size: 14px; }
  .bell { position: relative; border: 0; background: none; padding: 6px 4px 6px 8px; font-size: 17px; }
  #bell-count { position: absolute; top: 0; right: -4px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800;
    border-radius: 99px; padding: 1px 5px; line-height: 1.4; }
  body.signed-out .bell { display: none; }
  @media (max-width: 380px) { header .logo span, #modeTag { display: none; } }

  /* Public links, photos and bios, availability, export */
  body.signed-out.public header a[data-nav] { display: inline; }
  .public-banner { font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; }
  .avatar { border-radius: 50%; object-fit: cover; flex: 0 0 auto; display: inline-grid; place-items: center;
    color: #fff; font-weight: 800; vertical-align: middle; }
  .roster-name { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  .profile-head { display: flex; gap: 14px; align-items: center; margin: 4px 0 10px; }
  .bio { margin: 0 0 12px; white-space: pre-line; }
  textarea { font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; resize: vertical; }
  .avail-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
  .avail-buttons { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .avail-buttons .muted { margin-right: 2px; }
  button.on-yes { background: var(--good); color: #fff; border-color: transparent; }
  button.on-maybe { background: #eda100; color: #1a1a19; border-color: transparent; }
  button.on-no { background: var(--bad); color: #fff; border-color: transparent; }
  .avail-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
  .panel h4 { margin: 14px 0 4px; }
  .actions.lineup button.out:not(.in) { opacity: .45; }
  .export-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .export-buttons > span { width: 100%; font-size: 13px; }
  .export-row { margin: 8px 0 12px; }

  /* Game clock, timeouts, wind, and line presets */
  .clock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .clock .cap-hit { color: var(--bad); font-weight: 800; }
  .game-extras { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 13px; margin: -4px 2px 10px; }
  .line-presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .actions.lineup button { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .streak { font-size: 11px; font-weight: 600; opacity: .8; }
  .actions.lineup button.tired:not(.in) { border-color: #eda100; }
  .actions.lineup button.tired.in { box-shadow: inset 0 0 0 2px #eda100; }
  .tired-key { display: block; font-size: 12px; margin-top: 2px; }

  /* Schedule creator: game days and time slots */
  .weekday-picker { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .weekday-picker button { padding: 7px 9px; font-size: 13px; border-radius: 8px; }
  .weekday-picker button.on, .cat-tabs button.on { background: var(--text); color: var(--bg); border-color: transparent; }
  .slot-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .slot-chip { display: inline-flex; align-items: center; gap: 2px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 99px; padding: 4px 6px 4px 10px; font-size: 14px; color: var(--text); font-weight: 600; }

  /* Two-colour teams */
  .color2-toggle { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .color2-toggle input { width: auto; }
  .big-dot { width: 18px; height: 18px; margin: 0; }

  /* Team admins */
  .team-admins { font-size: 12px; margin: -2px 0 6px; }
  .link-btn { border: 0; background: none; padding: 0 2px; color: var(--muted); font-size: 12px; cursor: pointer; }

  /* End-of-season card on the Games page */
  .season-card { border: 2px solid var(--accent); }
  .season-card.champion-card { border-color: #eda100; }
  .season-card-title { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
  .season-card .row { flex-wrap: wrap; gap: 8px; }
  .season-card .row > * { flex: 0 0 auto; }
  .season-over { text-align: center; font-size: 13px; margin-top: 20px; }
  .season-over a { color: var(--accent); }

  /* Standings */
  table.standings td:nth-child(2) { white-space: nowrap; }
  .form { display: inline-flex; gap: 3px; }
  .form a { width: 18px; height: 18px; border-radius: 4px; font-size: 11px; font-weight: 800; display: inline-grid; place-items: center;
    text-decoration: none; color: #fff; }
  .form-W { background: var(--good); } .form-L { background: var(--bad); } .form-T { background: var(--muted); }

  /* Playoff bracket */
  .bracket { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: stretch; }
  .bround { flex: 0 0 200px; display: flex; flex-direction: column; justify-content: space-around; gap: 12px; }
  .bround-name { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
  .bmatch { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .bmatch a { color: inherit; text-decoration: none; display: block; }
  .bmatch.bye { opacity: .6; }
  .bteam { display: flex; align-items: center; gap: 4px; padding: 8px 10px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .bteam b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .bteam.won { font-weight: 800; }
  .seed { font-size: 11px; color: var(--muted); width: 16px; }
  .bfoot { display: flex; justify-content: flex-end; gap: 6px; padding: 4px 8px; min-height: 8px; }
  .bfoot:empty { padding: 0; }
  .champion { font-size: 18px; border: 2px solid #eda100; text-align: center; }
  .seed-list { margin: 8px 0 14px; padding-left: 22px; }
  .seed-list li { padding: 3px 0; }

  /* Notifications and installing */
  .notes { display: grid; gap: 2px; max-height: 55vh; overflow-y: auto; }

<script>
// ---------- Supabase (accounts) ----------
// Paste these from your Supabase project: Project Settings → API.
// The anon/publishable key is designed to be public, so it's fine in this file.
const SUPABASE_URL = 'https://rjpqplseazvxzakakngh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_gAzJjWvSQmVd4tmyxYLwxg_9GirzS_0';

// ---------- Data ----------

// Changes update `db` straight away (so taps feel instant) and are saved to Supabase in the background,
// in order, retrying while offline. Other people's changes arrive live through Supabase Realtime.
const LEGACY_KEY = 'frisbee-stats-v1';   // where this browser kept league data before Supabase
const uid = () => crypto.randomUUID();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

}

const emptyDb = () => ({ teams: [], games: [], settings: { onField: 7 }, claims: [], claimsReady: false, passReady: false,
  seasonsReady: false, seasons: [], hof: [], profiles: {}, avail: [] });
let db = emptyDb();
let dataLeagueId = null;   // which league `db` currently holds
let loading = null, loadError = null, channel = null;

function rememberLeague() {
  // A league opened from a public link is remembered for this tab only, so it doesn't replace your own league.
  try {
    if (mode === 'public') sessionStorage.setItem('frisbee-public', JSON.stringify(league));

  } catch {}
}

// Supabase rows ⇄ the shapes the screens use.
const toGame = r => ({
  id: r.id, homeId: r.home_id, awayId: r.away_id, status: r.status, created: Number(r.created_ms),
  when: r.scheduled_at, field: r.field, round: r.round, lineup: r.lineup, pointPlayers: r.point_players,
  firstPull: r.first_pull || null, seasonId: r.season_id || null,

});
const toEvent = r => ({
  id: r.id, t: Number(r.t), type: r.type, teamId: r.team_id, playerId: r.player_id,
  ...(r.assist_id ? { assistId: r.assist_id } : {}), ...(r.target_id ? { targetId: r.target_id } : {}),
  ...(r.played ? { played: r.played } : {}), ...(r.detail ? { detail: r.detail } : {})
});
// Season columns only exist once supabase/006 has been run.
const seasonCols = x => (db.seasonsReady ? { season_id: x.seasonId || activeSeason()?.id } : {});
const teamRow = t => ({ id: t.id, league_id: league.id, name: t.name, color: t.color, ...seasonCols(t),
  ...(db.color2Ready ? { color2: t.color2 || null } : {}) });   // column added by 013
const playerRows = t => t.players.map((p, i) => ({
  id: p.id, league_id: league.id, team_id: t.id, name: p.name, number: String(p.number ?? ''), sort: i,
  ...(db.seasonsReady ? { season_id: t.seasonId || activeSeason()?.id, person_id: p.personId || p.id } : {}),
  // A player linked to someone from a past season keeps their claimed account.
  ...(p.carryUser && p.userId ? { user_id: p.userId } : {})
}));
const gameRow = g => ({
  id: g.id, league_id: league.id, home_id: g.homeId, away_id: g.awayId, status: g.status, created_ms: g.created,
  scheduled_at: g.when || null, field: g.field ?? null, round: g.round ?? null,
  lineup: g.lineup || null, point_players: g.pointPlayers || null, ...seasonCols(g),
  ...(db.playoffsReady ? { stage: g.stage || 'regular', bracket_slot: g.bracketSlot || null } : {}),   // columns added by 008
  ...(db.detailsReady ? { wind: g.wind || null } : {}),                                                // column added by 009
  ...(db.passReady ? { first_pull: g.firstPull || null } : {})   // column added by supabase/005
});
const eventRow = (g, e) => ({
  id: e.id, league_id: league.id, game_id: g.id, t: e.t, type: e.type, team_id: e.teamId || null,
  player_id: e.playerId || null, assist_id: e.assistId || null, played: e.played || null,
  ...(db.passReady ? { target_id: e.targetId || null, detail: e.detail || null } : {})
});

// All of a league's rows from one table. Supabase returns at most 1000 rows per request,
// so fetch the first page (with a total count), then the rest in parallel.
async function fetchAll(table, leagueId, orders, { select = '*', filter = q => q } = {}) {
  const query = () => orders.reduce((q, o) => q.order(o), filter(sb.from(table).select(select, { count: 'exact' }).eq('league_id', leagueId)));
  const first = await query().range(0, 999);
  if (first.error) throw first.error;
  const pages = Math.ceil((first.count || 0) / 1000);
  const rest = await Promise.all(Array.from({ length: Math.max(0, pages - 1) }, (_, i) => query().range((i + 1) * 1000, (i + 2) * 1000 - 1)));
  for (const r of rest) if (r.error) throw r.error;
  return [first, ...rest].flatMap(r => r.data);
}

// Games and plays for some seasons (or every season, when `seasonIds` is null).
// Plays don't store their season, so they're filtered through their game.
function fetchGamesAndPlays(id, seasonIds) {
  return Promise.all([
    fetchAll('games', id, ['id'], { filter: q => (seasonIds ? q.in('season_id', seasonIds) : q) }),
    fetchAll('events', id, ['seq'], seasonIds ? { select: '*, games!inner(season_id)', filter: q => q.in('games.season_id', seasonIds) } : {})
  ]);
}

// Loads a league. Teams and rosters come for every season (they're small, and all-time features need them),
// but games and plays only for the current season plus any past seasons already opened (`alsoSeasons`);
// other past seasons load when first needed (see loadSeasons).
async function fetchLeague(id, alsoSeasons = []) {
  const seasons = await sb.from('seasons').select('*').eq('league_id', id).order('number');   // fails until supabase/006
  const active = seasons.data?.find(s => s.status === 'active');
  const loadIds = !seasons.error && active ? [...new Set([active.id, ...alsoSeasons])] : null;   // null = everything
  const [lg, teams, players, [games, events], passProbe, hof, playoffProbe, profiles, avail, teamAdmins, teamRequests, color2Probe] = await Promise.all([
    sb.from('leagues').select('*').eq('id', id).single()   // '*' so columns added by later updates are optional
      .then(r => { if (r.error) throw r.error; return r.data; }),
    fetchAll('teams', id, ['created_at', 'id']),
    fetchAll('players', id, ['sort', 'id']),
    fetchGamesAndPlays(id, loadIds),
    sb.from('games').select('first_pull').limit(1),   // fails until supabase/005 has been run
    sb.from('hall_of_fame').select('*').eq('league_id', id).order('inducted_at'),   // fails until supabase/006
    sb.from('games').select('stage').limit(1),   // fails until supabase/008 has been run
    sb.from('person_profiles').select('*').eq('league_id', id),   // these two fail until supabase/010
    sb.from('availability').select('*').eq('league_id', id),
    sb.from('team_admins').select('*').eq('league_id', id),   // these two fail until supabase/012
    sb.from('team_requests').select('*').eq('league_id', id).order('created_at'),
    sb.from('teams').select('color2').limit(1)   // fails until supabase/013 has been run
  ]);
  const claims = await fetchClaims(id);
  const next = {
    teams: teams.map(t => ({ id: t.id, name: t.name, color: t.color, color2: t.color2 || null, seasonId: t.season_id, players: [] })),
    color2Ready: !color2Probe.error,   // false until supabase/013_team_colors.sql has been run
    games: games.map(toGame),
    settings: { onField: lg.on_field, timeCap: lg.time_cap ?? null, minRoster: lg.min_roster ?? 0 },
    minRosterReady: 'min_roster' in lg,   // false until supabase/015_min_roster.sql has been run
    createdBy: lg.created_by,
    detailsReady: 'time_cap' in lg,   // false until supabase/009_game_details.sql has been run
    publicReady: 'is_public' in lg,   // false until supabase/010 has been run (and the next two)
    isPublic: !!lg.is_public,
    profilesReady: !profiles.error,
    profiles: Object.fromEntries((profiles.data || []).map(p => [p.person_id, p])),
    availReady: !avail.error,
    avail: avail.data || [],
    teamAdminsReady: !teamAdmins.error,   // false until supabase/012_team_admins.sql has been run
    teamAdmins: teamAdmins.data || [],
    teamRequests: teamRequests.data || [],
    claims: claims || [],
    claimsReady: !!claims,           // false until supabase/004_player_claims.sql has been run
    passReady: !passProbe.error,     // false until supabase/005_pass_by_pass.sql has been run
    seasonsReady: !seasons.error,    // false until supabase/006_seasons.sql has been run
    playoffsReady: !playoffProbe.error,   // false until supabase/008_playoffs.sql has been run
    seasons: seasons.data || [],
    loadedSeasons: loadIds || 'all',   // which seasons' games and plays are in `games`
    hof: hof.data || []
  };
  for (const p of players) next.teams.find(t => t.id === p.team_id)?.players.push({
    id: p.id, name: p.name, number: p.number, userId: p.user_id || null, personId: p.person_id || p.id
  });
  const byId = Object.fromEntries(next.games.map(g => [g.id, g]));
  for (const e of events) byId[e.game_id]?.events.push(toEvent(e));
  if (league?.id === id) { league.name = lg.name; league.border_colors = lg.border_colors; rememberLeague(); }
  return next;
}

// Player claims you're allowed to see: your own, or all of them in leagues you run.
// Returns null if the claims table doesn't exist yet.
async function fetchClaims(id) {
  const { data, error } = await sb.from('player_claims').select('*').eq('league_id', id).order('created_at');
  return error ? null : data;
}

// ----- Seasons -----
// db.teams and db.games hold every season; screens show the season being viewed (the active one by default).
let viewSeasonId = null;
const activeSeason = () => db.seasons.find(s => s.status === 'active') || null;
const viewSeason = () => db.seasons.find(s => s.id === viewSeasonId) || activeSeason();
const inViewSeason = x => !db.seasonsReady || x.seasonId === viewSeason()?.id;
const inActiveSeason = x => !db.seasonsReady || x.seasonId === activeSeason()?.id;
const seasonTeams = () => db.teams.filter(inViewSeason);
const seasonGames = () => db.games.filter(inViewSeason);
const viewingPast = () => db.seasonsReady && viewSeason()?.status === 'archived';
const canEdit = () => isAdmin() && !viewingPast();   // past seasons are read-only
const seasonName = id => db.seasons.find(s => s.id === id)?.name || '';

// A dropdown to switch seasons (only once there's more than one). `extra` adds options such as "All time".
function seasonPicker(onchange, extra = []) {
  if (!db.seasonsReady || db.seasons.length < 2 && !extra.length) return '';
  const current = viewingPast() || !extra.some(([v]) => v === viewSeasonId) ? viewSeason()?.id : viewSeasonId;
  return `<label class="season-picker"><span class="muted">Season</span>
    <select onchange="${onchange}(this.value)">
      ${[...db.seasons].reverse().map(s => `<option value="${s.id}" ${s.id === current ? 'selected' : ''}>
        ${esc(s.name)}${s.status === 'active' ? ' (current)' : ''}</option>`).join('')}
      ${extra.map(([v, label, on]) => `<option value="${v}" ${on ? 'selected' : ''}>${esc(label)}</option>`).join('')}
    </select></label>`;
}
function pickSeason(id) { viewSeasonId = id; editing = null; route(); }

// ----- All-time identity -----
// Each season has its own roster entry for a player; personId links them across seasons.
const personOf = pid => allPlayers().find(p => p.id === pid)?.personId || pid;
function personEntries(personId) {   // every season's roster entry for one person, oldest season first
  const num = sid => db.seasons.find(s => s.id === sid)?.number || 0;
  return allPlayers().filter(p => p.personId === personId).sort((a, b) => num(a.team.seasonId) - num(b.team.seasonId));
}
// Stats per person across every season.
function allTimeStats() {
  const an = analyze(db.games.filter(countsInSeason)), people = {};   // playoff games count only if their season says so
  for (const [pid, s] of Object.entries(an.players)) {
    const t = people[personOf(pid)] || (people[personOf(pid)] = ZERO());
    for (const k of Object.keys(ZERO())) t[k] += s[k] || 0;
  }
  for (const s of Object.values(people)) finishPlayer(s);
  return people;
}

// ----- Claimed players -----
const me = () => session?.user.id;
const allPlayers = () => db.teams.flatMap(t => t.players.map(p => ({ ...p, team: t })));
// Your player this season (or your most recent one, before seasons exist).
const myPlayer = () => allPlayers().filter(p => p.userId && p.userId === me())
  .sort((a, b) => inActiveSeason(b.team) - inActiveSeason(a.team))[0];
const myPendingClaim = () => db.claims.find(c => c.user_id === me() && c.status === 'pending');
const pendingClaims = () => db.claims.filter(c => c.status === 'pending');
const teamOf = pid => db.teams.find(t => t.players.some(p => p.id === pid));

// First load of a league; route() shows "Loading…" until it's done.
function loadLeague() {
  const id = league.id;
  if (!loading) loading = fetchLeague(id)
    .then(next => {
      if (league?.id !== id) return;
      db = next; dataLeagueId = id; loadError = null; offlineData = null;
      saveSnapshot(id, next);
      subscribeLeague(id);
    })
    .catch(async err => {
      // No signal: fall back to the copy saved on this device, if there is one.
      const snap = !err.code && await loadSnapshot(id);
      if (snap && league?.id === id) {
        db = snap.data; dataLeagueId = id; loadError = null; offlineData = snap.at;
        subscribeLeague(id);   // connects by itself once the signal is back
      } else loadError = dbErrorText(err);
    })
    .finally(() => { loading = null; updateSyncBadge(); route(); });
  return loading;
}
let offlineData = null;   // when set, the screens are showing the device's saved copy (from this time)

// ----- Past seasons, loaded when first needed -----
// Which seasons a page needs: all of them for all-time views, otherwise the one being looked at.
function seasonsNeeded(page, id) {
  if (!db.seasonsReady || db.loadedSeasons === 'all') return [];
  const all = db.seasons.map(s => s.id);
  const need = page === 'hof' || page === 'profile' || (page === 'leaders' && leaderScope === 'all')
    || ((page === 'box' || page === 'game') && !game(id)) ? all
    : page === 'team' ? [team(id)?.seasonId]
    : [viewSeason()?.id];
  return need.filter(s => s && !db.loadedSeasons.includes(s));
}

let seasonsLoading = null, seasonLoadFailed = false;
function loadSeasons(ids) {
  if (!seasonsLoading) seasonsLoading = fetchGamesAndPlays(league.id, ids)
    .then(([games, events]) => {
      const fresh = games.map(toGame), byId = Object.fromEntries(fresh.map(g => [g.id, g]));
      for (const e of events) byId[e.game_id]?.events.push(toEvent(e));
      db.games = [...db.games.filter(g => !ids.includes(g.seasonId)), ...fresh];
      db.loadedSeasons = [...new Set([...db.loadedSeasons, ...ids])];
      saveSnapshot(league.id, db);
    })
    .catch(() => { seasonLoadFailed = true; toast('Couldn’t load past seasons. Showing what’s loaded so far.'); })
    .finally(() => { seasonsLoading = null; route(); });
  return seasonsLoading;
}

// For actions (like exporting every season) that need all the data first.
async function withAllSeasons(fn) {
  const missing = db.seasonsReady && db.loadedSeasons !== 'all' ? db.seasons.map(s => s.id).filter(s => !db.loadedSeasons.includes(s)) : [];
  if (missing.length) { toast('Loading past seasons…'); await loadSeasons(missing); }
  fn();
}
window.addEventListener('online', () => { if (offlineData) refreshLeague(); });

// Re-fetch everything (after someone else changes teams or settings, or after reconnecting).
let refreshTimer, missedRemote = false;
function refreshLeague() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    if (!league || dataLeagueId !== league.id) return;
    if (writes.length) { missedRemote = true; return; } // try again once our own changes are saved
    const id = league.id, seq = writeSeq;
    try {
      const next = await fetchLeague(id, Array.isArray(db.loadedSeasons) ? db.loadedSeasons : []);
      if (league?.id !== id) return;
      // A change made while this was loading may be missing from it: don't show stale data, load again.
      if (writes.length || writeSeq !== seq) { missedRemote = true; if (!writes.length) refreshLeague(); return; }
      db = next; offlineData = null; updateSyncBadge();
      saveSnapshot(id, next);
      rerender();
    } catch {}
  }, 400);
}

// ----- Saving: a queue of changes sent to Supabase one at a time, in order -----
// Each change is a plain description (not code), so the queue can be kept on the device: if the page
// closes or the phone dies before changes reach Supabase, they're sent the next time the app opens.
//   { upsert: 'table', rows: [...] }         insert or update rows (safe to repeat)
//   { del: 'table', vals: [...], col: 'id' } delete rows whose col is one of vals
//   { rpc: 'function', args: {...} }         call a database function
let writes = [];
let flushing = false, offline = false;
const queueKey = () => `frisbee-queue:${session?.user.id}`;

function saveQueue() {
  try { localStorage.setItem(queueKey(), JSON.stringify(writes)); } catch {}
}

// After signing in: pick up any changes left over from last time.
function restoreQueue() {
  try {
    const saved = JSON.parse(localStorage.getItem(queueKey())) || [];
    if (!saved.length) return;
    writes = [...saved, ...writes];
    missedRemote = true;   // reload the league once they're in, so the screen matches
    toast(`Sending ${saved.length} change${saved.length === 1 ? '' : 's'} saved on this device…`);
    flush();
  } catch {}
}

// Queue one or more changes (applied in order). Falsy entries are skipped, for optional steps.
let writeSeq = 0;   // counts local changes, so a refresh can tell whether one happened while it loaded
function persist(...ops) {
  ops = ops.filter(Boolean);
  if (!ops.length) return;
  writeSeq++;
  writes.push({ ops, done: 0, leagueId: league.id });
  saveQueue();
  flush();
}

function runOp(op) {
  if (op.upsert) return sb.from(op.upsert).upsert(op.rows);
  if (op.del) { const q = sb.from(op.del).delete().in(op.col || 'id', op.vals); return op.match ? q.match(op.match) : q; }
  return sb.rpc(op.rpc, op.args);
}

async function flush() {
  if (flushing || !session) return;
  flushing = true;
  while (writes.length && session) {
    const w = writes[0];
    let error = null;
    // Resume where it left off (every step is safe to repeat anyway).
    for (; w.done < w.ops.length; w.done++) {
      try { ({ error } = await runOp(w.ops[w.done])); } catch (err) { error = { message: String(err) }; }
      if (error) break;
    }
    if (error && !error.code) {
      // No answer from Supabase (no signal, or a hiccup): wait and retry the same change.
      offline = true; updateSyncBadge(); saveQueue();
      await new Promise(r => setTimeout(r, 3000));
      if (!session) break;
      continue;
    }
    offline = false;
    writes.shift(); saveQueue();
    if (error) {
      // Supabase refused it (e.g. not an admin of this league): drop it and re-sync with the server.
      toast(`Couldn’t save a change: ${dbErrorText(error)}`);
      if (league?.id === w.leagueId) missedRemote = true;
    }
    updateSyncBadge();
  }
  flushing = false;
  updateSyncBadge();
  if (missedRemote && session) { missedRemote = false; refreshLeague(); }
}
window.addEventListener('online', () => flush());

let needsRender = false, subscribedOnce = false;

// Re-render with fresh data, unless the user is mid-way through something (a pop-up, typing, editing a team).
function rerender() {
  const typing = ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName);
  if (sheet.classList.contains('open') || typing || editing) { needsRender = true; return; }
  const y = scrollY; route(); scrollTo(0, y);

function subscribeLeague(id) {
  if (channel) sb.removeChannel(channel);
  subscribedOnce = false;
  const f = `league_id=eq.${id}`;
  const on = (event, table, handler, filter = f) =>
    channel.on('postgres_changes', { event, schema: 'public', table, ...(filter ? { filter } : {}) }, handler);
  channel = sb.channel(`league-${id}`);
  on('INSERT', 'events', p => remoteEvent(p.new));
  on('INSERT', 'games', p => remoteGame(p.new));
  on('UPDATE', 'games', p => remoteGame(p.new));
  on('*', 'teams', refreshLeague);
  on('*', 'players', refreshLeague);
  on('UPDATE', 'leagues', refreshLeague, `id=eq.${id}`);
  // Deletes can't be filtered by league, so check whether the row is one of ours.
  on('DELETE', 'events', p => remoteDelete('event', p.old.id), null);
  on('DELETE', 'games', p => remoteDelete('game', p.old.id), null);
  on('DELETE', 'teams', p => { if (team(p.old.id)) refreshLeague(); }, null);
  on('DELETE', 'players', p => { if (db.teams.some(t => t.players.some(x => x.id === p.old.id))) refreshLeague(); }, null);
  if (db.seasonsReady) {  // only once the seasons tables exist
    on('INSERT', 'seasons', p => remoteSeason(p.new));
    on('UPDATE', 'seasons', refreshLeague);
    on('INSERT', 'hall_of_fame', p => remoteHof(p.new));
    on('DELETE', 'hall_of_fame', p => { if (db.hof.some(h => h.id === p.old.id)) refreshLeague(); }, null);
  }
  if (db.teamAdminsReady) {   // only once supabase/012 has been run
    on('INSERT', 'team_requests', p => {
      if (isAdmin() && p.new.user_id !== me()) notify(`🧢 ${p.new.user_email || 'Someone'} ${p.new.kind === 'new' ? `wants to add ${p.new.name}` : 'wants to manage a team'}`, '#/games');
      refreshLeague();
    });
    on('UPDATE', 'team_requests', p => {
      if (p.new.user_id === me() && p.new.status !== 'pending') notify(p.new.status === 'approved' ? '✅ Your team request was approved' : 'Your team request was denied', '#/teamadmin');
      refreshLeague();
    });
    on('*', 'team_admins', refreshLeague);
  }
  if (db.profilesReady) {   // only once supabase/010 has been run
    on('*', 'person_profiles', refreshLeague);
    on('*', 'availability', refreshLeague);
  }
  if (db.claimsReady) {   // only once the claims table exists
    on('INSERT', 'player_claims', p => remoteClaim(p.new));
    on('UPDATE', 'player_claims', p => remoteClaim(p.new));
    on('DELETE', 'player_claims', p => { if (db.claims.some(c => c.id === p.old.id)) { db.claims = db.claims.filter(c => c.id !== p.old.id); rerender(); } }, null);
  }
  channel.subscribe(status => {
    if (status !== 'SUBSCRIBED') return;
    if (subscribedOnce) refreshLeague(); // reconnected: catch up on anything missed
    subscribedOnce = true;
  });
}

function unsubscribeLeague() {
  if (channel) sb.removeChannel(channel);
  channel = null;
}

function remoteEvent(r) {
  const g = game(r.game_id);
  if (!g || g.events.some(e => e.id === r.id)) return; // not ours, or our own change coming back
  g.events.push(toEvent(r));
  rerender();
}

function remoteClaim(c) {
  const i = db.claims.findIndex(x => x.id === c.id), before = db.claims[i];
  if (i >= 0) db.claims[i] = c; else db.claims.push(c);
  const p = player(c.player_id);
  // Notifications: admins hear about new requests; the person claiming hears the decision.
  if (!before && c.status === 'pending' && isAdmin() && c.user_id !== me())
    notify(`🙋 ${c.user_email || 'Someone'} wants to claim ${p.name}`, '#/games');
  if (before?.status === 'pending' && c.user_id === me() && c.status !== 'pending')
    notify(c.status === 'approved' ? `✅ You’re now linked to ${p.name}!` : `Your claim for ${p.name} was denied`, `#/profile/${c.player_id}`);
  rerender();
}

function remoteGame(r) {
  const next = toGame(r), g = game(r.id);
  if (g) {
    const same = JSON.stringify(gameRow(g)) === JSON.stringify(gameRow({ ...next }));
    if (same) return;                                      // our own change coming back
    if (writes.length) { missedRemote = true; return; }    // our newer changes are still saving; re-sync after
    const was = g.status;
    Object.assign(g, next, { events: g.events });
    // Someone else started or finished a game.
    const h = team(g.homeId), a = team(g.awayId);
    if (h && a && was !== 'live' && g.status === 'live') notify(`🟢 Live now: ${h.name} vs ${a.name}`, `#/box/${g.id}`);
    if (h && a && was === 'live' && g.status === 'final') notify(`🏁 Final: ${h.name} ${score(g, h.id)}–${score(g, a.id)} ${a.name}`, `#/box/${g.id}`);
  } else {
    db.games.push(next);
  }
  rerender();
}

// New seasons and Hall of Fame inductions (from another device).
function remoteSeason(s) {
  if (!db.seasons.some(x => x.id === s.id) && s.status === 'active') notify(`🏁 ${s.name} has started`, '#/games');
  refreshLeague();
}
function remoteHof(h) {
  if (!db.hof.some(x => x.id === h.id)) notify(`🏆 ${h.name} was inducted into the Hall of Fame`, '#/hof');
  refreshLeague();
}

function remoteDelete(kind, id) {
  if (kind === 'game') {
    if (!game(id)) return;
    db.games = db.games.filter(g => g.id !== id);
  } else {
    const g = db.games.find(g => g.events.some(e => e.id === id));
    if (!g) return;
    g.events = g.events.filter(e => e.id !== id);
  }
  rerender();
}

// ----- One-time upload of data this browser saved before leagues moved to Supabase -----
function legacyData() {
  try {
    const d = JSON.parse(localStorage.getItem(`${LEGACY_KEY}:${league.id}`));
    return d && (d.teams?.length || d.games?.length) ? d : null;
  } catch { return null; }
}

function discardLegacy() {
  if (!confirm('Delete the teams and games saved on this device? They won’t be uploaded.')) return;
  try { localStorage.removeItem(`${LEGACY_KEY}:${league.id}`); } catch {}
  route();
}

async function uploadLegacy(btn) {
  const d = legacyData();
  if (!d) return;
  btn.disabled = true; btn.textContent = 'Uploading…';
  const chunks = (rows, n = 500) => Array.from({ length: Math.ceil(rows.length / n) }, (_, i) => rows.slice(i * n, i * n + n));
  const games = (d.games || []).map(g => ({ ...g, created: g.created || Date.now() }));
  const ops = [
    { upsert: 'teams', rows: d.teams.map(teamRow) },
    { upsert: 'players', rows: d.teams.flatMap(playerRows) },
    { upsert: 'games', rows: games.map(gameRow) },
    ...chunks(games.flatMap(g => g.events.map(e => eventRow(g, e)))).map(rows => ({ upsert: 'events', rows })),
    d.settings?.onField && { rpc: 'set_league_on_field', args: { p_league_id: league.id, p_on_field: d.settings.onField } }
  ].filter(Boolean);
  let error = null;
  for (const op of ops) { ({ error } = await runOp(op)); if (error) break; }
  if (error) { btn.disabled = false; btn.textContent = 'Try again'; toast(`Upload failed: ${dbErrorText(error)}`); return; }
  try { localStorage.removeItem(`${LEGACY_KEY}:${league.id}`); } catch {}
  toast('Uploaded! Everyone in the league can see these teams and games now.');
  dataLeagueId = null; route();
}

const team = id => db.teams.find(t => t.id === id);
// A team's colour as a CSS background: solid, or split diagonally when it has a second colour.
const teamBg = t => (t?.color2 ? `linear-gradient(135deg, ${t.color} 50%, ${t.color2} 50%)` : t?.color || '#888');

function player(id) {
  for (const t of db.teams) { const p = t.players.find(p => p.id === id); if (p) return p; }
  return { id, name: '(removed)', number: '' };
}
const pname = id => { const p = player(id); return `${p.name}${p.number !== '' ? ' #' + p.number : ''}`; };
const score = (g, tid) => g.events.filter(e => e.teamId === tid && (e.type === 'goal' || e.type === 'callahan')).length;

// Player and team stats are worked out by analyze() in stats.js.

const LABEL = {
  goal: 'Goal', d: 'D', throwaway: 'Throwaway', drop: 'Drop', callahan: 'Callahan', half: 'Halftime',
  pull: 'Pull', pickup: 'Pickup', pass: 'Pass', stall: 'Stall', timeout: 'Timeout'
};

// Halftime is stored as a 'half' event in the play-by-play (no player attached).
// Returns the score at halftime, or null if the game hasn't reached it.
function halftimeScore(g) {
  const i = g.events.findIndex(e => e.type === 'half');
  if (i < 0) return null;
  const first = { ...g, events: g.events.slice(0, i) };
  return [score(first, g.homeId), score(first, g.awayId)];
}

function route() {
  closeSheet();
  document.body.classList.toggle('signed-out', !session || recovering);
  if (!sb) return renderSetup();
  if (!authReady) { app.innerHTML = ''; return; }
  if (recovering) return renderNewPassword();
  const [page, id] = location.hash.replace(/^#\/?/, '').split('/');
  if (page === 'view' && id) return enterPublic(id);   // a public link: no account needed
  document.body.classList.toggle('public', isPublicView());
  if (!session && !isPublicView()) return renderLogin();
  const inLeague = !!(league && mode) && ['games', 'game', 'box', 'leaders', 'teams', 'schedule', 'settings', 'profile', 'team', 'hof', 'standings', 'playoffs'].includes(page);
  updateBell();
  document.body.classList.toggle('no-nav', !inLeague);
  document.body.classList.toggle('player', !isAdmin());
  document.getElementById('modeTag').textContent = inLeague ? (isAdmin() ? 'Admin' : isTeamMode() ? 'Team admin' : isPublicView() ? 'Public' : 'Player') : '';
  document.querySelectorAll('[data-nav]').forEach(a =>
    a.classList.toggle('on', (a.dataset.nav === 'games' && ['games', 'game', 'box', 'schedule', 'settings'].includes(page))
      || (a.dataset.nav === 'teams' && (page === 'profile' || page === 'team'))
      || (a.dataset.nav === 'leaders' && page === 'hof') || (a.dataset.nav === 'standings' && page === 'playoffs')
      || a.dataset.nav === page));
  if (page === 'admin') return id === 'create' ? renderCreateLeague() : renderAdminHome();
  if (page === 'teamadmin') return id ? renderTeamRequest(id) : renderTeamAdminHome();
  if (page === 'player') return renderPlayerHome();
  if (!inLeague) {
    if (isPublicView()) { location.hash = '#/games'; return; }   // public viewers stay in their league
    return renderMenu();
  }
  if (dataLeagueId !== league.id) {
    if (loadError) {
      app.innerHTML = `<h1>${esc(league.name)}</h1><p class="msg error">Couldn’t load this league: ${esc(loadError)}</p>
        <button class="primary" onclick="loadError = null; route()">Try again</button>`;
    } else {
      app.innerHTML = `<h1>${esc(league.name)}</h1><p class="muted">Loading league…</p>`;
      loadLeague();
    }
    return;
  }
  const missing = seasonLoadFailed ? [] : seasonsNeeded(page, id);
  if (missing.length) {
    app.innerHTML = `<h1>${esc(league.name)}</h1><p class="muted">Loading past season${missing.length === 1 ? '' : 's'}…</p>`;
    loadSeasons(missing);
    return;
  }
  if (page === 'game' && game(id)) return canTrack(game(id)) ? renderTracker(game(id)) : renderBox(game(id));
  if (page === 'box' && game(id)) { renderBox(game(id)); return tickClocks(); }
  if (page === 'leaders') return renderLeaders();
  if (page === 'teams') return isAdmin() || (isTeamMode() && db.teamAdminsReady) ? renderTeams() : renderRosters();
  if (page === 'profile') return renderProfile(id);
  if (page === 'team') return renderTeamPage(id);
  if (page === 'hof') return renderHallOfFame();
  if (page === 'standings') return renderStandings();
  if (page === 'playoffs') return renderPlayoffs();
  if (page === 'schedule' && isAdmin()) return renderSchedule();
  if (page === 'settings' && isAdmin()) return renderSettings();
  renderGames();
}

let searchTimer;
function searchLeagues(kind) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = document.getElementById('q').value.trim().replace(/[%_\\]/g, '\\$&');
    let req = sb.from('leagues').select('id, name, border_colors').order('name').limit(25);
    if (q) req = req.ilike('name', `%${q}%`);
    const { data, error } = await req;
    const box = document.getElementById('results');
    if (!box) return;
    if (error) { box.innerHTML = `<p class="msg error">${esc(dbErrorText(error))}</p>`; return; }
    data.forEach(l => leagueCache[l.id] = l);
    const live = await liveLeagueIds(data.map(l => l.id));
    if (!document.getElementById('results')) return;
    if (!data.length) {
      box.innerHTML = `<p class="muted">${q ? 'No leagues match that name.' : 'No leagues have been created yet.'}</p>`;
      return;
    }
    box.innerHTML = data.map(l => kind === 'team'
      ? `<a class="card game-link" href="#/teamadmin/${l.id}" style="${borderStyle(l.border_colors)}">
          <span><b>${esc(l.name)}</b></span><span class="muted">Register or manage a team →</span></a>`

          <span><b>${esc(l.name)}</b>${live.has(l.id) ? liveBadge : ''}</span><span class="muted">View →</span></a>`

async function joinLeague(ev, id) {
  ev.preventDefault();
  const btn = ev.submitter; btn.disabled = true;
  const { data, error } = await sb.rpc('join_league', { p_league_id: id, p_password: document.getElementById('lp-' + id).value });
  btn.disabled = false;
  if (error) { document.getElementById('lm-' + id).textContent = dbErrorText(error); return; }
  // Since supabase/007, join_league answers { ok, league } or { ok: false, error } (so wrong guesses can be counted).
  if (data && 'ok' in data) {
    if (!data.ok) { document.getElementById('lm-' + id).textContent = data.error; return; }
    return enterLeague(data.league, 'admin');

}

  const args = { p_name: document.getElementById('ln').value, p_password: pw };

          </span>
        </div>`;
      }).join('')}

async function decideClaim(id, approve, btn) {
  btn.disabled = true;
  const { data, error } = await sb.rpc('decide_claim', { p_claim_id: id, p_approve: approve });
  if (error) { btn.disabled = false; toast(dbErrorText(error)); refreshLeague(); return; }
  const p = player(data.player_id);
  if (approve) {
    // Mirror what the database did: link the player, and turn down anyone else waiting on them.
    const pl = db.teams.flatMap(t => t.players).find(x => x.id === data.player_id);
    if (pl) pl.userId = data.user_id;
    db.claims.forEach(c => { if (c.player_id === data.player_id && c.status === 'pending') c.status = 'denied'; });
  }
  const i = db.claims.findIndex(c => c.id === id);
  if (i >= 0) db.claims[i] = data;
  toast(approve ? `Approved: ${data.user_email || 'they'} can now follow ${p.name}’s stats.` : `Denied the claim for ${p.name}.`);
  route();
}

  return `<a class="card game-link" href="#/teams">

async function claimPlayer(pid) {
  const p = player(pid);
  if (!confirm(`Claim #${p.number} ${p.name}? An admin of ${league.name} will need to approve it.`)) return;
  const { data, error } = await sb.rpc('request_claim', { p_player_id: pid });
  if (error) return toast(dbErrorText(error));
  db.claims.push(data);
  toast('Claim sent! You’ll see your stats here once an admin approves it.');
  route();
}

async function cancelClaim(id) {
  if (!confirm('Cancel your claim request?')) return;
  const { error } = await sb.rpc('cancel_claim', { p_claim_id: id });
  if (error) return toast(dbErrorText(error));
  db.claims = db.claims.filter(c => c.id !== id);
  route();
}

async function releasePlayer(pid) {
  const p = allPlayers().find(x => x.id === pid);
  const mine = p.userId === me();
  if (!confirm(mine ? `Unclaim ${p.name}? You’d need an admin to approve you again.` : `Unlink ${p.name} from the account that claimed them?`)) return;
  const { error } = await sb.rpc('release_player', { p_player_id: pid });
  if (error) return toast(dbErrorText(error));
  const pl = db.teams.flatMap(t => t.players).find(x => x.id === pid);
  if (pl) pl.userId = null;
  route();
}

async function loadAdmins() {
  const box = document.getElementById('admin-list');
  const { data, error } = await sb.from('league_admins').select('user_id, user_email, joined_at').eq('league_id', league.id).order('joined_at');
  if (!document.getElementById('admin-list')) return;
  if (error) { box.innerHTML = `<span class="msg error">${esc(dbErrorText(error))}</span>`; return; }
  adminsCache = data;
  box.innerHTML = data.map(a => {
    const creator = a.user_id === db.createdBy, self = a.user_id === me();
    return `<div class="claim-row"><span><b>${esc(a.user_email || 'Unknown email')}</b>
        ${self ? '<span class="badge you">YOU</span>' : ''} ${creator ? '<span class="badge">CREATOR</span>' : ''}
        <div class="muted" style="font-size:12px">Admin since ${new Date(a.joined_at).toLocaleDateString()}</div></span>
      ${!self && !creator ? `<button class="small" onclick="removeAdmin('${a.user_id}', false)">Remove</button>` : ''}</div>`;
  }).join('') + (data.length === 1 ? '<p class="muted" style="margin-bottom:0">You’re the only admin. Share the league password with anyone who should help run the league.</p>' : '');
}

let adminsCache = [];
async function removeAdmin(userId, self) {
  const email = adminsCache.find(a => a.user_id === userId)?.user_email || '';
  const q = self ? `Leave ${league.name}? You’ll no longer be able to manage it.` : `Remove ${email || 'this admin'} from ${league.name}? They can rejoin only with the league password, so change it if needed.`;
  if (!confirm(q)) return;
  const { error } = await sb.rpc('remove_league_admin', { p_league_id: league.id, p_user_id: userId });
  if (error) return toast(dbErrorText(error));
  if (self) { toast(`You left ${league.name}.`); leaveLeague(); location.hash = '#/admin'; return; }
  toast(`Removed ${email || 'the admin'}.`);
  loadAdmins();
}

async function changeLeaguePassword(ev) {
  ev.preventDefault();
  const pw = document.getElementById('new-pw').value, msg = document.getElementById('pw-msg');
  const { error } = await sb.rpc('change_league_password', { p_league_id: league.id, p_password: pw });
  msg.classList.toggle('error', !!error);
  msg.textContent = error ? dbErrorText(error) : 'Password changed. Share the new one with anyone who should be able to join.';
  if (!error) document.getElementById('new-pw').value = '';
}

async function deleteLeague() {
  const typed = prompt(`This permanently deletes ${league.name}: every season, team, player, game, stat, claim and Hall of Fame entry, for everyone. It can’t be undone.\n\nType the league name to confirm:`);
  if (typed === null) return;
  if (writes.length) return toast('Some changes are still saving. Try again in a moment.');
  if (typed.trim().toLowerCase() !== league.name.trim().toLowerCase()) return toast('The name didn’t match, so nothing was deleted.');
  // Remove the players' photos first (while we're still an admin of the league, which storage checks).
  if (db.profilesReady) {
    const { data: files } = await sb.storage.from('player-photos').list(league.id, { limit: 1000 });
    if (files?.length) await sb.storage.from('player-photos').remove(files.map(f => `${league.id}/${f.name}`));
  }
  const { error } = await sb.rpc('delete_league', { p_league_id: league.id, p_confirm_name: typed });
  if (error) return toast(dbErrorText(error));
  const name = league.name;
  leaveLeague(); location.hash = '#/admin';
  toast(`${name} was deleted.`);
}

// ---------- Schedule creator ----------
const pad = n => String(n).padStart(2, '0');
const localDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localDateTime = d => `${localDate(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

let sched = null;          // the creator's settings, kept while you tweak them
let schedPreview = null;   // the generated games, shown before saving

// Circle-method round robin: every team plays every other team exactly once.
// With an odd number of teams, one team sits out (a bye) each round.
function roundRobin(ids) {
  const t = [...ids];
  if (t.length % 2) t.push(null);
  const n = t.length, rounds = [], homes = {};
  for (let r = 0; r < n - 1; r++) {
    const games = []; let bye = null;
    for (let i = 0; i < n / 2; i++) {
      const x = t[i], y = t[n - 1 - i];
      if (!x || !y) { bye = x || y; continue; }
      // Keep home games balanced: whoever has hosted less so far is home.
      const [h, a] = (homes[x] || 0) <= (homes[y] || 0) ? [x, y] : [y, x];
      homes[h] = (homes[h] || 0) + 1;
      games.push([h, a]);
    }
    rounds.push({ games, bye });
    t.splice(1, 0, t.pop()); // rotate everyone except the first team
  }
  return rounds;
}

const flipRound = r => ({ games: r.games.map(([h, a]) => [a, h]), bye: r.bye });

function shuffled(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function buildRounds(s) {
  const ids = seasonTeams().map(t => t.id);
  const base = roundRobin(s.shuffle ? shuffled(ids) : ids);
  if (s.type === 'single') return base;
  if (s.type === 'double') return [...base, ...base.map(flipRound)];
  // Set number of rounds: cycle through the round robin, swapping home/away on each repeat.
  return Array.from({ length: s.rounds }, (_, i) =>
    Math.floor(i / base.length) % 2 ? flipRound(base[i % base.length]) : base[i % base.length]);
}

  if (schedPreview && !schedPreview.every(r => r.games.every(g => team(g.homeId) && team(g.awayId)))) schedPreview = null;
  const n = seasonTeams().length;
  const perRound = n % 2 ? n : n - 1;           // rounds in one full round robin

  const opt = (value, title, text) => `

// ----- Game days and time slots -----
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmtSlot = t => new Date(`2000-01-01T${t}`).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const gamesPerRound = () => Math.floor(seasonTeams().length / 2);
function toggleWeekday(i) {
  sched.days = sched.days.includes(i) ? sched.days.filter(d => d !== i) : [...sched.days, i].sort();
  schedPreview = null; renderSchedule();
}
function addSlot() {
  const t = document.getElementById('new-slot').value;
  if (t && !sched.slots.includes(t)) sched.slots = [...sched.slots, t].sort();
  schedPreview = null; renderSchedule();
}
function removeSlot(t) { sched.slots = sched.slots.filter(x => x !== t); schedPreview = null; renderSchedule(); }
// Suggest the next time on the hour after the latest slot.
function nextSlot() {
  const last = [...sched.slots].sort().at(-1);
  if (!last) return '18:00';
  const h = (+last.slice(0, 2) + 1) % 24;
  return `${String(h).padStart(2, '0')}:${last.slice(3)}`;
}
// How many games fit on a game day, compared with how many a round needs.
function slotNote() {
  const need = gamesPerRound();
  if (sched.timeMode === 'start') return 'If a round has more games than fields, the extra games start one game length later.';
  const fit = sched.slots.length * (sched.fields || 0);
  return fit < need
    ? `<b style="color:var(--bad)">A game day fits ${fit} game${fit === 1 ? '' : 's'} (${sched.slots.length} time${sched.slots.length === 1 ? '' : 's'} × ${sched.fields} field${sched.fields === 1 ? '' : 's'}), but each round has ${need}. Add a time or a field.</b>`
    : `A game day fits ${fit} game${fit === 1 ? '' : 's'}; each round has ${need}.${fit > need ? ' Some slots will be empty each day.' : ''}`;
}
function renderSlotNote() { const el = document.getElementById('slot-note'); if (el) el.innerHTML = slotNote(); }

// The date of each round: every N days, or the chosen weekdays in order from the start date.
function roundDates(count, s) {
  const out = [], d = new Date(`${s.start}T00:00`);
  if (s.dayMode === 'every') {
    for (let i = 0; i < count; i++) { const x = new Date(d); x.setDate(d.getDate() + i * s.every); out.push(x); }
  } else {
    for (let guard = 0; out.length < count && guard < 3660; guard++) {
      if (s.days.includes(d.getDay())) out.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
  }
  return out;
}

// Put a round's games into time slots. With balancing on, each game goes where its two teams have played least
// so far (tried in many orders, keeping the most even), so nobody is always the early or late game.
function assignSlots(games, slots, fields, counts, balance) {
  const capacity = () => Object.fromEntries(slots.map(s => [s, fields]));
  const place = order => {
    const left = capacity(), out = [];
    let cost = 0;
    for (const gi of order) {
      const [h, a] = games[gi];
      const options = slots.filter(s => left[s] > 0);
      const score = s => (counts[h]?.[s] || 0) ** 2 + (counts[a]?.[s] || 0) ** 2;
      const s = balance ? options.reduce((best, x) => (score(x) < score(best) ? x : best)) : options[0];
      cost += score(s); left[s]--;
      out[gi] = { slot: s, field: fields - left[s] };
    }
    return { out, cost };
  };
  let best = place(games.map((_, i) => i));
  if (balance) for (let k = 0; k < 80; k++) {
    const order = shuffled(games.map((_, i) => i)), r = place(order);
    if (r.cost < best.cost) best = r;
  }
  best.out.forEach((p, gi) => { for (const t of games[gi]) { counts[t] = counts[t] || {}; counts[t][p.slot] = (counts[t][p.slot] || 0) + 1; } });
  return best.out;
}

// Any settings change makes the current preview out of date.
function schedChanged() {
  schedPreview = null;
  const p = document.getElementById('preview');
  if (p) p.innerHTML = '';
}

function previewSchedule() {
  const s = sched, err = t => { document.getElementById('schedMsg').textContent = t; };
  if (!s.start) return err('Pick the first game date.');
  if (s.dayMode === 'every' && !(s.every >= 1)) return err('Days between rounds must be at least 1.');
  if (s.dayMode === 'weekdays' && !s.days.length) return err('Pick at least one game day.');
  if (!(s.fields >= 1 && s.fields <= 20)) return err('Fields available must be between 1 and 20.');
  if (s.timeMode === 'start' && !s.time) return err('Pick a time for the first game.');
  if (s.timeMode === 'start' && !(s.length >= 10)) return err('Game length must be at least 10 minutes.');
  if (s.timeMode === 'slots' && !s.slots.length) return err('Add at least one time slot.');
  if (s.timeMode === 'slots' && s.slots.length * s.fields < gamesPerRound()) return err('A game day doesn’t fit a whole round. Add a time slot or a field.');
  if (s.type === 'rounds' && !(s.rounds >= 1 && s.rounds <= 100)) return err('Number of rounds must be between 1 and 100.');
  err('');
  const rounds = buildRounds(s), dates = roundDates(rounds.length, s);
  // "Start time + game length" is turned into time slots too (start, start + length, …), so both modes can be balanced.
  const slots = s.timeMode === 'slots' ? [...s.slots].sort() : Array.from({ length: Math.ceil(gamesPerRound() / s.fields) || 1 }, (_, k) => {
    const [hh, mm] = s.time.split(':').map(Number), t = new Date(2000, 0, 1, hh, mm + k * s.length);
    return `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
  });
  // Balancing round by round is greedy, so plan the whole season several times and keep the most even
  // (smallest gap between a team's most- and least-played time slot, then the smoothest overall).
  const unevenness = c => {
    const per = Object.values(c).map(t => slots.map(sl => t[sl] || 0));
    return [Math.max(0, ...per.map(x => Math.max(...x) - Math.min(...x))), per.flat().reduce((a, x) => a + x * x, 0)];
  };
  let plan = null;
  for (let attempt = 0; attempt < (s.balance ? 40 : 1); attempt++) {
    const c = {}, placed = rounds.map(r => assignSlots(r.games, slots, s.fields, c, s.balance)), score = unevenness(c);
    if (!plan || score[0] < plan.score[0] || (score[0] === plan.score[0] && score[1] < plan.score[1])) plan = { placed, score };
    if (plan.score[0] <= 1) break;   // can't do better than within one game
  }
  schedPreview = rounds.map((r, ri) => {
    const day = dates[ri], placed = plan.placed[ri];
    return {
      bye: r.bye,
      games: r.games.map(([homeId, awayId], gi) => {
        const [hh, mm] = placed[gi].slot.split(':').map(Number), t = new Date(day);
        t.setHours(hh, mm, 0, 0);
        return { id: uid(), homeId, awayId, status: 'scheduled', round: ri + 1, field: placed[gi].field,
          when: localDateTime(t), created: Date.now(), events: [] };
      }).sort((a, b) => a.when.localeCompare(b.when) || a.field - b.field)
    };
  });
  document.getElementById('preview').innerHTML = previewHtml();
  document.getElementById('preview').scrollIntoView({ behavior: 'smooth' });
}

function previewHtml() {
  const games = schedPreview.flatMap(r => r.games);
  const perTeam = {};
  games.forEach(g => { perTeam[g.homeId] = (perTeam[g.homeId] || 0) + 1; perTeam[g.awayId] = (perTeam[g.awayId] || 0) + 1; });
  const counts = seasonTeams().map(t => perTeam[t.id] || 0);
  const min = Math.min(...counts), max = Math.max(...counts);
  const existing = seasonGames().filter(g => g.status === 'scheduled').length;
  const time = w => new Date(w).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return `
    <h2>Preview</h2>
    <div class="card"><b>${schedPreview.length} rounds · ${games.length} games</b>
      <div class="muted">Each team plays ${min === max ? min : `${min}–${max}`} games.</div></div>
    ${slotBalanceTable(games)}
    ${schedPreview.map((r, i) => `
      <div class="card round">
        <h3><span>Round ${i + 1}</span><span class="muted">${new Date(r.games[0]?.when || Date.now()).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}</span></h3>
        ${r.games.map(g => `<div class="match">
          <span><span class="dot" style="background:${teamBg(team(g.homeId))}"></span>${esc(team(g.homeId).name)}
            <span class="muted">vs</span> <span class="dot" style="background:${teamBg(team(g.awayId))}"></span>${esc(team(g.awayId).name)}</span>
          <span class="muted">${time(g.when)} · F${g.field}</span></div>`).join('')}
        ${r.bye ? `<div class="match muted"><span>Bye: ${esc(team(r.bye).name)}</span></div>` : ''}
      </div>`).join('')}
    <div class="row" style="margin-bottom:24px">
      ${existing ? `<button onclick="saveSchedule(false)">Add to current schedule</button>
        <button class="primary" onclick="saveSchedule(true)">Replace current (${existing} games)</button>`
        : '<button class="primary" onclick="saveSchedule(false)">Save schedule</button>'}
    </div>`;
}

// How many times each team plays in each time slot, so admins can see it's fair.
function slotBalanceTable(games) {
  const times = [...new Set(games.map(g => g.when.slice(11)))].sort();
  if (times.length < 2) return '';
  const count = (tid, t) => games.filter(g => (g.homeId === tid || g.awayId === tid) && g.when.slice(11) === t).length;
  const rows = seasonTeams().map(tm => ({ tm, c: times.map(t => count(tm.id, t)) }));
  const spread = Math.max(...rows.map(r => Math.max(...r.c) - Math.min(...r.c)));
  return `<div class="card">
    <div class="chart-title">Games per time slot</div>
    <div class="muted" style="font-size:13px;margin-bottom:6px">${spread <= 1 ? '✓ Every team plays each time slot about the same number of times.'
      : `Some teams play one time slot up to ${spread} more times than another.`}</div>
    <div class="table-wrap"><table>
      <thead><tr><th class="l">Team</th>${times.map(t => `<th>${fmtSlot(t)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr><td class="l"><span class="dot" style="background:${teamBg(r.tm)}"></span>${esc(r.tm.name)}</td>
        ${r.c.map(n => `<td>${n}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div></div>`;
}

function saveSchedule(replace) {
  if (replace && !confirm('Remove the current upcoming games and use this schedule instead?')) return;
  const added = schedPreview.flatMap(r => r.games).map(g => ({ ...g, seasonId: activeSeason()?.id || null }));
  const rows = added.map(gameRow);
  const oldIds = replace ? seasonGames().filter(g => g.status === 'scheduled').map(g => g.id) : [];
  db.games = db.games.filter(g => !oldIds.includes(g.id));
  db.games.push(...added);
  persist(oldIds.length && { del: 'games', vals: oldIds }, { upsert: 'games', rows });
  schedPreview = null;
  location.hash = '#/games';
}

function newGame() {
  const homeId = document.getElementById('home').value, awayId = document.getElementById('away').value;
  if (homeId === awayId) return alert('Pick two different teams.');
  const g = { id: uid(), homeId, awayId, created: Date.now(), status: 'live', events: [], seasonId: activeSeason()?.id || null };
  db.games.push(g); saveGame(g);
  location.hash = `#/game/${g.id}`;
}

const ui = { gameId: null, teamId: null, playerId: null };

// The latest plays, newest first (used by the tracker and the live box score).
function playLog(g, limit, emptyText) {
  const recent = g.events.slice(-limit).reverse(), half = halftimeScore(g);
  const mins = e => `${Math.max(0, Math.floor((e.t - g.created) / 60000))}'`;
  if (!recent.length) return `<div class="muted">${emptyText}</div>`;
  const who = id => (id ? esc(pname(id)) : '<span class="muted">unknown</span>');
  const detail = e => {
    switch (e.type) {
      case 'pass': return `${who(e.playerId)} <span class="muted">→</span> ${who(e.targetId)}`;
      case 'pull': return `${who(e.playerId)}${e.detail?.ob ? ' <span class="muted">(out of bounds)</span>' : ''}`;
      case 'goal': case 'drop': return `${who(e.playerId)}${e.assistId ? ` <span class="muted">from ${who(e.assistId)}</span>` : ''}`;
      case 'timeout': return esc(team(e.teamId)?.name || '');
      default: return who(e.playerId);
    }
  };
  return `<ul class="log">${recent.map(e => e.type === 'half' ? `
    <li><span class="time">${mins(e)}</span>
      <span><span class="tag half">Halftime</span> ${half[0]}–${half[1]}</span></li>` : `
    <li><span class="time">${mins(e)}</span>
      <span><span class="dot" style="background:${teamBg(team(e.teamId))}"></span>
      <span class="tag ${e.type}">${LABEL[e.type]}</span> ${detail(e)}</span></li>`).join('')}
  </ul>`;
}

// League setting: how many players each team has on the field at once.
const onFieldMax = () => db.settings?.onField || 7;

// A team's roster split into who's on the field and who's on the bench for this game.
// With no lineup set, everyone counts as "on" so nothing is hidden.
function splitRoster(g, tid, excludeId) {
  const players = team(tid).players.filter(p => p.id !== excludeId);
  const lineup = g.lineup?.[tid];
  if (!lineup) return { on: players, bench: [], hasLineup: false };
  return { on: players.filter(p => lineup.includes(p.id)), bench: players.filter(p => !lineup.includes(p.id)), hasLineup: true };
}

// Buttons for a player picker pop-up: on-field players first, then the bench.
function pickerButtons(tid, excludeId, onclick) {
  const { on, bench } = splitRoster(game(ui.gameId), tid, excludeId);
  const btn = p => `<button onclick="${onclick(p.id)}">#${esc(p.number)} ${esc(p.name)}</button>`;
  return on.map(btn).join('') + (bench.length
    ? `<div class="full muted divider">Bench</div>${bench.map(btn).join('')}` : '');
}

// Where a game is up to, worked out from its plays (so Undo only has to remove the last play):
//   choose → nobody has pulled yet;  pull → between points;  pickup → a team needs to pick up the disc;
//   possession → someone has the disc.
function gameState(g) {
  const other = t => (t === g.homeId ? g.awayId : g.homeId);
  const s = { phase: g.firstPull ? 'pull' : 'choose', pulling: g.firstPull || null, offense: null, holder: null, passes: 0, point: 1 };
  for (const e of g.events) {
    switch (e.type) {
      case 'pull': s.phase = 'pickup'; s.pulling = e.teamId; s.offense = other(e.teamId); s.holder = null; break;
      case 'pickup': s.phase = 'possession'; s.offense = e.teamId; s.holder = e.playerId; s.passes = 0; break;
      case 'pass': s.holder = e.targetId; s.passes++; break;
      case 'throwaway': case 'drop': case 'stall':
        s.phase = 'pickup'; s.offense = other(e.teamId); s.holder = null; break;
      case 'goal': case 'callahan':   // the team that scored pulls next
        s.phase = 'pull'; s.pulling = e.teamId; s.offense = null; s.holder = null; s.point++; break;
      case 'half':                    // teams swap: whoever received to start the game pulls to start the second half
        s.phase = 'pull'; s.pulling = g.firstPull ? other(g.firstPull) : s.pulling; s.offense = null; s.holder = null; break;
    }
  }
  s.defense = s.offense ? other(s.offense) : null;
  if (s.phase === 'pull') s.receiving = other(s.pulling);
  return s;
}

function renderTracker(g) {

  const lineupBar = tids => `<div class="row lineup-bar">

      <div class="tabs" style="margin-top:12px">${[h, a].map(x =>

    </div>${lineupBar([h.id, a.id])}`;
  } else if (st.phase === 'pull') {
