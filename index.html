// ----- Game clock, time cap, timeouts and wind -----
// The game clock runs from the first pull; the point clock from the current point's pull.
function gameClockHtml(g, st) {
  const firstPull = g.events.find(e => e.type === 'pull');
  if (!firstPull || g.status !== 'live') return '';
  const lastPull = [...g.events].reverse().find(e => e.type === 'pull' || e.type === 'goal' || e.type === 'callahan');
  const inPoint = lastPull?.type === 'pull' && st.phase !== 'pull';
  const cap = db.settings.timeCap;
  return `<div class="clock">⏱ <span data-clock-since="${firstPull.t}"></span>
    ${inPoint ? `· point <span data-clock-since="${lastPull.t}"></span>` : ''}
    ${cap ? `<div data-cap-at="${firstPull.t + cap * 60000}"></div>` : ''}</div>`;
}
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function tickClocks() {
  for (const el of document.querySelectorAll('[data-clock-since]')) el.textContent = mmss(Date.now() - +el.dataset.clockSince);
  for (const el of document.querySelectorAll('[data-cap-at]')) {
    const left = +el.dataset.capAt - Date.now();
    el.textContent = left > 0 ? `Cap in ${mmss(left)}` : 'Time cap reached';
    el.classList.toggle('cap-hit', left <= 0);
  }
}
setInterval(tickClocks, 1000);

function timeoutsThisHalf(g, tid) {
  const halfAt = g.events.findIndex(e => e.type === 'half');
  const events = halfAt < 0 ? g.events : g.events.slice(halfAt);
  return events.filter(e => e.type === 'timeout' && e.teamId === tid).length;
}

function timeoutSheet() {
  const g = game(ui.gameId);
  openSheet(`
    <h3>Timeout. Which team called it?</h3>
    <div class="actions">
      ${[g.homeId, g.awayId].map(tid => `<button onclick="recordTimeout('${tid}')"><span class="dot" style="background:${teamBg(team(tid))}"></span>${esc(team(tid).name)}
        <span class="muted">(${timeoutsThisHalf(g, tid)} used)</span></button>`).join('')}
      <button class="full" onclick="closeSheet()">Cancel</button>
    </div>`);
}
function recordTimeout(tid) { play('timeout', { teamId: tid }); route(); }

const WIND_DIRS = { left: '← toward the left end zone', right: 'toward the right end zone →', cross: '↕ across the field' };
const WIND_SHORT = { left: 'toward the left end zone', right: 'toward the right end zone', cross: 'across the field' };
const windText = w => (w?.mph ? `🌬 ${w.mph} mph${w.dir ? ` ${WIND_SHORT[w.dir]}` : ''}` : '');
let windDraft = null;
function windSheet() {
  const g = game(ui.gameId);
  windDraft = windDraft?.gameId === g.id ? windDraft : { gameId: g.id, mph: g.wind?.mph ?? 5, dir: g.wind?.dir || null };
  openSheet(`
    <h3>🌬 Wind</h3>
    <p class="muted" style="margin-top:0">Directions are as seen from where you’re standing on the sideline.</p>
    <div class="stepper" style="justify-content:center">
      <button onclick="windDraft.mph = Math.max(0, windDraft.mph - 1); windSheet()">−</button>
      <b>${windDraft.mph}</b><span class="muted">mph</span>
      <button onclick="windDraft.mph = Math.min(60, windDraft.mph + 1); windSheet()">+</button>
    </div>
    <div class="actions" style="margin-top:12px">
      ${Object.entries(WIND_DIRS).map(([k, label]) => `<button class="${windDraft.dir === k ? 'in' : ''} ${k === 'cross' ? 'full' : ''}"
        onclick="windDraft.dir = '${k}'; windSheet()">${label}</button>`).join('')}
      <button onclick="saveWind(null)">No wind</button>
      <button class="goal" onclick="saveWind(windDraft)">Save</button>
      <button class="full" onclick="closeSheet()">Cancel</button>
    </div>`);
}
function saveWind(w) {
  const g = game(ui.gameId);
  g.wind = w && w.mph > 0 ? { mph: w.mph, dir: w.dir } : null;
  windDraft = null; saveGame(g); route();
}

// ---------- Lineup ----------
// A draft of both teams' lineups while the pop-up is open; saved to the game on Done.
let lineupDraft = null, lineupTeam = null;

function openLineup() {
  const g = game(ui.gameId);
  lineupDraft = { [g.homeId]: [...(g.lineup?.[g.homeId] || [])], [g.awayId]: [...(g.lineup?.[g.awayId] || [])] };
  // No lineup yet? Start with the players who said they're coming (up to the on-field limit).
  if (db.availReady && !g.events.length) for (const tid of [g.homeId, g.awayId]) {
    if (!lineupDraft[tid].length) lineupDraft[tid] = team(tid).players.filter(p => availOf(g.id, p.id) === 'yes').map(p => p.id).slice(0, onFieldMax());
  }
  // Open on the team currently shown, or the home team (ui.teamId can be left over from another game).
  lineupTeam = ui.teamId === g.awayId ? g.awayId : g.homeId;
  renderLineup();
}

// Lines this team used earlier in the game, and how many points in a row each player has played.
function lineHistory(g, tid) {
  const pts = analyzeGame(g).points.filter(p => p.played?.[tid]);
  const lastOf = f => [...pts].reverse().find(f)?.played[tid] || null;
  const streak = {};
  for (const p of team(tid).players) {
    let n = 0;
    for (let i = pts.length - 1; i >= 0 && pts[i].played[tid].includes(p.id); i--) n++;
    streak[p.id] = n;
  }
  return { last: pts.at(-1)?.played[tid] || null, o: lastOf(p => p.receiving === tid), d: lastOf(p => p.pulling === tid), streak };
}

function useLine(which) {
  const g = game(ui.gameId), hist = lineHistory(g, lineupTeam), ids = hist[which] || [];
  const roster = new Set(team(lineupTeam).players.map(p => p.id));
  lineupDraft[lineupTeam] = ids.filter(id => roster.has(id)).slice(0, onFieldMax());
  renderLineup();
}

function renderLineup(msg = '') {
  const g = game(ui.gameId), max = onFieldMax(), sel = lineupDraft[lineupTeam], t = team(lineupTeam);
  const hist = lineHistory(g, lineupTeam), st = gameState(g);
  // Between points we know who's on offense next.
  const nextRole = st.phase === 'pull' ? (st.receiving === lineupTeam ? 'offense' : 'defense') : null;
  const preset = (key, label) => `<button class="small ${nextRole && key === nextRole[0] ? 'primary' : ''}" ${hist[key] ? `onclick="useLine('${key}')"` : 'disabled'}>${label}</button>`;
  openSheet(`
    <h3>Lineup</h3>
    <div class="tabs">${[g.homeId, g.awayId].map(tid => {
      const x = team(tid), on = tid === lineupTeam;
      return `<button class="${on ? 'on' : ''}" style="border-color:${x.color};${on ? 'background:' + x.color : ''}"
        onclick="lineupTeam = '${tid}'; renderLineup()">${esc(x.name)} (${lineupDraft[tid].length})</button>`;
    }).join('')}</div>
    ${nextRole ? `<div class="muted">${esc(t.name)} ${nextRole === 'offense' ? 'receive the pull (offense)' : 'pull (defense)'} next point.</div>` : ''}
    <div class="line-presets">
      ${preset('last', '↺ Last point')}${preset('o', 'Last O-line')}${preset('d', 'Last D-line')}
    </div>
    <div class="muted">Tap players to put them in or take them out.
      <b style="color:var(--text)">${sel.length} / ${max}</b> on the field.
      ${Object.values(hist.streak).some(n => n >= 3) ? '<span class="tired-key">🔥 = played 3+ points in a row</span>' : ''}</div>
    <div class="msg error">${esc(msg)}</div>
    <div class="actions lineup">${t.players.map(p => {
      const n = hist.streak[p.id] || 0, av = db.availReady ? availOf(g.id, p.id) : null;
      return `<button class="${sel.includes(p.id) ? 'in' : ''} ${n >= 3 ? 'tired' : ''} ${av === 'no' ? 'out' : ''}" onclick="toggleLineup('${p.id}')">
        ${sel.includes(p.id) ? '✓ ' : ''}#${esc(p.number)} ${esc(p.name)}
        ${av ? `<span class="streak">${av === 'yes' ? 'Said they’re in' : av === 'maybe' ? 'Maybe coming' : 'Said they’re out'}</span>` : ''}
        ${n >= 2 ? `<span class="streak">${n >= 3 ? '🔥' : ''}${n} in a row</span>` : ''}</button>`;
    }).join('')}
    </div>
    <div class="actions" style="margin-top:12px">
      <button onclick="lineupDraft[lineupTeam] = []; renderLineup()">Clear ${esc(t.name)}</button>
      <button class="goal" onclick="saveLineup()">Done</button>
      <button class="full" onclick="closeSheet()">Cancel</button>
    </div>`);
}

function toggleLineup(pid) {
  const sel = lineupDraft[lineupTeam], i = sel.indexOf(pid);
  if (i >= 0) sel.splice(i, 1);
  else if (sel.length >= onFieldMax()) return renderLineup(`Only ${onFieldMax()} players can be on the field. Take someone out first.`);
  else sel.push(pid);
  renderLineup();
}

function saveLineup() {
  const g = game(ui.gameId);
  for (const tid of [g.homeId, g.awayId]) {
    if (lineupDraft[tid].length > onFieldMax()) {
      lineupTeam = tid;
      return renderLineup(`${team(tid).name} has more than ${onFieldMax()} players on the field.`);
    }
  }
  // An empty lineup means "not set", so the whole roster is shown again.
  // Mid-point once the pull is in the air (a timeout or halftime between points doesn't count).
  const midPoint = eventsThisPoint(g).some(e => e.type !== 'half' && e.type !== 'timeout');
  g.lineup = {};
  g.pointPlayers = g.pointPlayers || {};
  for (const tid of [g.homeId, g.awayId]) {
    const lineup = lineupDraft[tid].length ? lineupDraft[tid] : null;
    g.lineup[tid] = lineup;
    // A sub during a point means both players played it; a change between points just replaces the lineup.
    g.pointPlayers[tid] = midPoint
      ? [...new Set([...(g.pointPlayers[tid] || []), ...(lineup || [])])]
      : [...(lineup || [])];
  }
  saveGame(g); route();
}

// ---------- Points played ----------
// Plays since the last goal, newest first.
function eventsThisPoint(g) {
  const out = [];
  for (let i = g.events.length - 1; i >= 0; i--) {
    const e = g.events[i];
    if (e.type === 'goal' || e.type === 'callahan') break;
    out.push(e);
  }
  return out;
}

// Who played the point that's ending, per team. Only teams with a lineup set are counted.
// Anyone who recorded a stat this point also played it, even if they weren't in the lineup.
function pointSnapshot(g, scoringPlay) {
  const played = {};
  const plays = [...eventsThisPoint(g), scoringPlay];
  for (const tid of [g.homeId, g.awayId]) {
    const lineup = g.lineup?.[tid];
    if (!lineup) continue;
    const ids = new Set([...(g.pointPlayers?.[tid] || []), ...lineup]);
    for (const e of plays) if (e.teamId === tid) {
      for (const id of [e.playerId, e.assistId, e.targetId]) if (id) ids.add(id);
    }
    played[tid] = [...ids];
  }
  return played;
}

function halftime() {
  const g = game(ui.gameId);
  if (!confirm(`Mark halftime at ${score(g, g.homeId)}–${score(g, g.awayId)}?`)) return;
  const e = { id: uid(), t: Date.now(), type: 'half' };
  g.events.push(e); saveEvent(g, e);
  route();
}

// ----- Recording plays -----
// Plays recorded together (a throwaway and its block) share a group id, so one Undo removes both.
function play(type, fields = {}) {
  const g = game(ui.gameId), e = { id: uid(), t: Date.now(), type, ...fields };
  g.events.push(e); saveEvent(g, e);
  return e;
}
const stateNow = () => gameState(game(ui.gameId));

function setFirstPull(tid) {
  const g = game(ui.gameId);
  g.firstPull = tid; saveGame(g); route();
}

function pullSheet(pid) {
  openSheet(`
    <h3>Pull${pid ? ` by ${esc(pname(pid))}` : ''}</h3>
    <div class="actions">
      <button class="goal" onclick="recordPull(${pid ? `'${pid}'` : 'null'}, false)">In bounds</button>
      <button class="to" onclick="recordPull(${pid ? `'${pid}'` : 'null'}, true)">Out of bounds</button>
      <button class="full" onclick="closeSheet()">Cancel</button>
    </div>`);
}

function recordPull(pid, ob) {
  play('pull', { teamId: stateNow().pulling, playerId: pid, ...(ob ? { detail: { ob: true } } : {}) });
  route();
}

function recordPickup(pid) { play('pickup', { teamId: stateNow().offense, playerId: pid }); route(); }

function recordPass(pid) {
  const st = stateNow();
  play('pass', { teamId: st.offense, playerId: st.holder, targetId: pid });
  route();
}

// A goal or callahan ends the point: note who played it, and start the next point with the current lineup.
function endPoint(type, fields) {
  const g = game(ui.gameId);
  fields.played = pointSnapshot(g, fields);
  g.pointPlayers = { [g.homeId]: [...(g.lineup?.[g.homeId] || [])], [g.awayId]: [...(g.lineup?.[g.awayId] || [])] };
  play(type, fields);
  saveGame(g);
}

function goalSheet() {
  const st = stateNow();
  openSheet(`
    <h3>Goal! Who caught it? <span class="muted">(thrown by ${esc(player(st.holder).name)})</span></h3>
    <div class="actions">
      ${pickerButtons(st.offense, st.holder, id => `recordGoal('${id}')`)}
      <button class="full" onclick="closeSheet()">Cancel</button>
    </div>`);
}

function recordGoal(pid) {

}

function dropSheet() {

}

function recordDrop(pid) {
  const st = stateNow();
  play('drop', { teamId: st.offense, playerId: pid, assistId: st.holder });
  route();
}

function throwawaySheet() {

    <h3>Throwaway by ${esc(player(st.holder).name)}</h3>

      ${pickerButtons(def.id, null, id => `recordThrowaway('${id}')`)}
      <button class="full d" onclick="callahanSheet()">Callahan (caught in the end zone for a goal)…</button>

    </div>`);
}

function recordThrowaway(blockerId) {
  const st = stateNow(), grp = uid();
  play('throwaway', { teamId: st.offense, playerId: st.holder, detail: { grp } });

function recordCallahan(pid) {

// Words for a play, e.g. "Pass Jordan → Sam".
function describePlay(e) {
  const n = id => (id ? player(id).name : 'someone');
  switch (e.type) {
    case 'pass': return `Pass ${n(e.playerId)} → ${n(e.targetId)}`;
    case 'pull': return `Pull${e.playerId ? ` by ${n(e.playerId)}` : ''}${e.detail?.ob ? ' (out of bounds)' : ''}`;
    case 'pickup': return `Pickup by ${n(e.playerId)}`;
    case 'goal': return `Goal ${n(e.playerId)}${e.assistId ? ` from ${n(e.assistId)}` : ''}`;
    case 'drop': return `Drop by ${n(e.playerId)}`;
    case 'half': return 'Halftime';
    case 'timeout': return `Timeout by ${team(e.teamId)?.name || 'a team'}`;
    default: return `${LABEL[e.type]} ${n(e.playerId)}`;
  }
}

// Undo the last play (or the last group of plays recorded together). No confirmation: it's a quick fix
// that's easy to redo, and the message says what was removed.
function undo() {
  const g = game(ui.gameId), last = g.events.at(-1);
  if (!last) return;
  const grp = last.detail?.grp, batch = [];
  for (let i = g.events.length - 1; i >= 0; i--) {
    if (batch.length && !(grp && g.events[i].detail?.grp === grp)) break;
    batch.push(g.events[i]);
  }
  g.events.length -= batch.length;
  const ids = batch.map(e => e.id);
  persist({ del: 'events', vals: ids });
  const ended = batch.find(e => e.played);
  if (ended) { g.pointPlayers = ended.played; saveGame(g); } // back in the point that play ended
  toast(`Undone: ${batch.reverse().map(describePlay).join(' + ')}`);
  route();
}

function endGame() {
  if (!confirm('End this game and mark it final?')) return;
  const g = game(ui.gameId);
  g.status = 'final'; saveGame(g);
  if (g.stage === 'playoff') advanceBracket();   // the winner moves on
  location.hash = `#/box/${ui.gameId}`;
}

function openSheet(html) {

  sheet.classList.add('open');

}

// ---------- Stat tables ----------
function statTable(rows, cols, sortKey, onSortName) {
  return `<div class="table-wrap"><table>
    <thead><tr>${cols.map(c => `<th class="${c.l ? 'l' : ''} ${c.k === sortKey ? 'sorted' : ''}" ${c.title ? `title="${esc(c.title)}"` : ''}
      ${onSortName && c.sort !== false ? `onclick="${onSortName}('${c.k}')"` : ''}>${c.h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.userId && r.userId === me() ? 'me' : ''}">${cols.map(c => `<td class="${c.l ? 'l' : ''}">${c.f ? c.f(r) : r[c.k]}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

// Highest first; names A–Z; stats that can't be calculated (null) go last.
function sortRows(rows, key) {
  return rows.sort((x, y) => {
    if (key === 'name') return x.name.localeCompare(y.name);
    const a = x[key], b = y[key];
    if (a == null || b == null) return (a == null) - (b == null);
    return b - a || (y.pm ?? 0) - (x.pm ?? 0);
  });
}

// Keep the sort column valid for the current stat category.
function sortKeyFor(key) {
  const keys = STAT_CATS[statCat].cols.map(c => c[0]);
  return key === 'name' || keys.includes(key) ? key : keys[0];
}

const playerNameCol = (showTeam = true) => ({
  k: 'name', h: 'Player', l: true,
  f: r => `<a href="#/profile/${r.id}" style="color:inherit">${showTeam ? `<span class="dot" style="background:${teamBg(r.team)}"></span>` : `<span class="muted">#${esc(r.number)}</span> `}${esc(r.name)}</a>`
});
const statFootnote = '<p class="muted foot">* Can’t be calculated yet (for example, no pass-by-pass games). +/- = goals + assists + Ds − drops − throwaways − stalls. Hover a column name to see what it means.</p>';

// ---------- Box score (a game's page) ----------
let boxTab = 'stats', boxSort = 'pm';
function sortBox(k) { boxSort = k; route(); }

function renderBox(g) {
  const an = analyze([g]), r = an.games[0] || analyzeGame(g);
  const h = team(g.homeId), a = team(g.awayId), half = halftimeScore(g);
  const live = g.status === 'live';
  boxSort = sortKeyFor(boxSort);
  const rowsFor = t => sortRows(t.players.map(p => ({ ...p, team: t, ...statsOf(an, p.id) })), boxSort);

  // Game leaders: the top player in a few headline stats.
  const everyone = [...rowsFor(h), ...rowsFor(a)];
  const leaders = [['g', 'Goals'], ['a', 'Assists'], ['d', 'Ds'], ['pm', 'Plus/minus'], ['taT', 'Throwaways'], ['tou', 'Touches']].map(([k, label]) => {
    const best = Math.max(0, ...everyone.map(p => p[k] || 0));
    const who = everyone.filter(p => best > 0 && p[k] === best);
    return who.length ? [label, `${who.map(p => p.name).slice(0, 3).join(', ')}${who.length > 3 ? '…' : ''} (${best})`] : null;
  }).filter(Boolean);

  const statsTab = !playoffStatsKept(g) ? `
    ${scoreChart(r)}
    <p class="muted">Player stats aren’t kept for playoff games this season (chosen when the playoffs were set up). The score and play-by-play are still here.</p>` : `
    ${isPlayoff(g) && !countsInSeason(g) ? '<p class="muted">🏆 Playoff game: these stats count toward playoff stats, not the regular season.</p>' : ''}
    ${leaders.length ? `<div class="card"><div class="chart-title">Game leaders</div>
      <div class="leaders-list">${leaders.map(([l, v]) => `<div><span class="muted">${l}</span><b>${esc(v)}</b></div>`).join('')}</div></div>` : ''}
    ${scoreChart(r)}
    ${statCatTabs('route()')}
    ${[h, a].map(t => `<h2><span class="dot" style="background:${teamBg(t)}"></span>${esc(t.name)} · ${score(g, t.id)}</h2>
      <div class="card">${statTable(rowsFor(t), statCols(playerNameCol(false)), boxSort, 'sortBox')}</div>`).join('')}
    ${statFootnote}`;

  const pointsTab = r.points.length ? `<div class="card">${r.points.map((p, i) => {
    const t = team(p.scorer), how = p.type === 'callahan' ? 'Callahan' : p.pulling ? (p.scorer === p.receiving ? 'Hold' : 'Break') : 'Goal';
    const secs = p.pulling ? Math.max(0, Math.round((p.end - p.start) / 1000)) : null;
    const on = tid => (p.played?.[tid] || []).map(id => player(id).name).join(', ');
    return `<div class="point-row">
      <div class="point-head"><span class="muted">#${i + 1}</span>
        <b>${esc(h.name)} ${p.score[0]}–${p.score[1]} ${esc(a.name)}</b>
        <span class="badge ${how === 'Break' || how === 'Callahan' ? 'live' : ''}">${how.toUpperCase()}</span></div>
      <div><span class="dot" style="background:${teamBg(t)}"></span>${esc(t.name)} scored
        ${p.scorerId ? `· ${esc(player(p.scorerId).name)}${p.assistId ? ` from ${esc(player(p.assistId).name)}` : ''}` : ''}</div>
      <div class="muted">${[p.pulling ? `${esc(team(p.pulling).name)} pulled` : '', secs != null ? `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}` : '',
        r.tracked ? `${p.throws} throws` : '', `${p.turns} turnover${p.turns === 1 ? '' : 's'}`].filter(Boolean).join(' · ')}</div>
      ${p.played ? `<div class="muted on-field">${[h, a].filter(x => on(x.id)).map(x => `${esc(x.name)}: ${esc(on(x.id))}`).join('<br>')}</div>` : ''}
    </div>`;
  }).join('')}</div>` : '<p class="muted">No points played yet.</p>';

  app.innerHTML = `
    ${live ? `
    <div class="card scoreboard live-board">
      <div class="team" style="color:${h.color}">${esc(h.name)}</div>
      <div>
        <div class="muted"><span class="live-dot"></span><b style="color:var(--bad)">LIVE</b></div>
        <div class="nums">${score(g, h.id)}–${score(g, a.id)}</div>
        <div class="muted">${half ? `2nd half · HT ${half[0]}–${half[1]}` : '1st half'}</div>
        ${gameClockHtml(g, gameState(g))}
      </div>
      <div class="team" style="color:${a.color}">${esc(a.name)}</div>
    </div>
    <p class="muted" style="text-align:center;margin-top:-4px">Updates automatically as plays are recorded.${g.wind ? ` ${windText(g.wind)}.` : ''}</p>
    <h2>Recent plays</h2><div class="card">${playLog(g, 8, 'No plays yet.')}</div>` : `
    <div class="row" style="justify-content:space-between">
      <h1 style="flex:1">${esc(h.name)} ${score(g, h.id)} – ${score(g, a.id)} ${esc(a.name)}</h1>
      <span class="badge ${g.status}" style="flex:0 0 auto">${STATUS[g.status]}</span>
    </div>
    <div class="muted">${new Date(g.created).toLocaleString()}${half ? ` · Halftime ${half[0]}–${half[1]}` : ''}${g.wind ? ` · ${windText(g.wind)}` : ''}${(() => {
      const pulls = g.events.filter(e => e.type === 'pull'), end = [...g.events].reverse().find(e => e.type === 'goal' || e.type === 'callahan');
      return pulls.length && end && end.t > pulls[0].t ? ` · ⏱ ${mmss(end.t - pulls[0].t)}` : '';
    })()}</div>`}
    <div class="tabs leader-tabs" style="margin-top:14px">
      <button class="${boxTab === 'stats' ? 'on' : ''}" onclick="boxTab = 'stats'; route()">Stats</button>
      <button class="${boxTab === 'points' ? 'on' : ''}" onclick="boxTab = 'points'; route()">Points</button>
    </div>
    ${boxTab === 'points' ? pointsTab : statsTab}
    <div class="row export-row">
      <button class="small" onclick="exportBoxScore('${g.id}')">⬇ Box score CSV</button>
      <button class="small" onclick="exportPlays('${g.id}')">⬇ Play-by-play CSV</button>
    </div>
    ${canTrack(g) ? `<div class="row">
      ${g.status === 'live'
        ? `<a class="btn primary" href="#/game/${g.id}">Back to tracking</a>`
        : `<button onclick="reopen('${g.id}')">Reopen game</button>`}
      ${isAdmin() ? `<button onclick="deleteGame('${g.id}')">Delete game</button>` : ''}
    </div>` : ''}`;
}

function reopen(id) { const g = game(id); g.status = 'live'; saveGame(g); location.hash = `#/game/${id}`; }
function deleteGame(id) {
  if (!confirm('Delete this game and all its stats? This cannot be undone.')) return;
  db.games = db.games.filter(g => g.id !== id);
  persist({ del: 'games', vals: [id] });
  location.hash = '#/games';
}

// ---------- Leaderboard ----------
let leaderSort = 'pm';
let leaderView = 'all', leaderTeamId = null;   // 'all' players, or one 'team'
function sortLeaders(k) { leaderSort = k; renderLeaders(); }

let leaderScope = 'season';   // 'season' (the one being viewed) or 'all' (every season added up, per person)
function pickLeaderSeason(v) {
  if (v === 'all') leaderScope = 'all'; else { leaderScope = 'season'; viewSeasonId = v; }
  route();   // loads the seasons it needs first
}

let leaderPhase = 'season';   // 'season' or 'playoffs' (when playoff stats are kept separately)
function renderLeaders() {
  if (leaderScope === 'all' && db.seasonsReady) return renderAllTimeLeaders();
  const sid = viewSeason()?.id, playoffTab = db.playoffsReady && hasPlayoffTab(sid);
  if (!playoffTab) leaderPhase = 'season';
  const teams = seasonTeams(), games = seasonGames().filter(leaderPhase === 'playoffs' ? countsInPlayoffs : countsInSeason);
  const an = analyze(games);
  // "Teams" view: pick a team (defaults to your own claimed team, else the first one).
  if (leaderView === 'team' && !teams.some(x => x.id === leaderTeamId)) leaderTeamId = teams.find(x => x.players.some(p => p.userId === me()))?.id || teams[0]?.id;
  const t = leaderView === 'team' ? team(leaderTeamId) : null;
  leaderSort = sortKeyFor(leaderSort);
  const rows = sortRows((t ? [t] : teams).flatMap(tm => tm.players.map(p => ({ ...p, team: tm, ...statsOf(an, p.id) }))), leaderSort);
  const played = games.filter(g => g.status !== 'scheduled' && (!t || g.homeId === t.id || g.awayId === t.id));
  const ts = t && an.teams[t.id];
  const db_teams = teams;
  app.innerHTML = `
    <div class="row"><h1>Leaders</h1>${db.seasonsReady ? '<a class="btn small" href="#/hof">🏆 Hall of Fame</a>' : ''}
      <button class="small" onclick="exportPlayerStats()" title="Download as a spreadsheet">⬇ CSV</button></div>
    ${seasonPicker('pickLeaderSeason', [['all', 'All time', false]])}
    ${playoffTab ? `<div class="cat-tabs phase-tabs">
      <button class="${leaderPhase === 'season' ? 'on' : ''}" onclick="leaderPhase = 'season'; renderLeaders()">${playoffStatsMode(sid) === 'both' ? 'Season (with playoffs)' : 'Regular season'}</button>
      <button class="${leaderPhase === 'playoffs' ? 'on' : ''}" onclick="leaderPhase = 'playoffs'; renderLeaders()">🏆 Playoffs</button>
    </div>` : ''}
    <div class="tabs leader-tabs">
      <button class="${t ? '' : 'on'}" onclick="leaderView = 'all'; renderLeaders()">All</button>
      <button class="${t ? 'on' : ''}" onclick="leaderView = 'team'; renderLeaders()">Teams</button>
    </div>
    ${leaderView === 'team' ? (db_teams.length ? `
      <div class="team-chips">${db_teams.map(x => `
        <button class="${x.id === t.id ? 'on' : ''}" style="--c:${esc(x.color)}"
          onclick="leaderTeamId = '${x.id}'; renderLeaders()"><span class="dot" style="background:${teamBg(x)}"></span>${esc(x.name)}</button>`).join('')}
      </div>
      <a class="card game-link" href="#/team/${t.id}">
        <span><b><span class="dot" style="background:${teamBg(t)}"></span>${esc(t.name)}</b>
          <span class="muted">· ${ts ? `${ts.w}–${ts.l}${ts.t ? `–${ts.t}` : ''} record · ${ts.scored} scored, ${ts.allowed} allowed` : 'no games yet'}</span></span>
        <span class="muted">Team stats →</span></a>` : '<p class="muted">No teams yet.</p>') : ''}
    <p class="muted">${played.length} game${played.length === 1 ? '' : 's'} played. Tap a column to sort, or a name to see that player’s games.</p>
    ${statCatTabs('renderLeaders()')}
    ${rows.length ? `<div class="card">${statTable(rows, statCols(playerNameCol()), leaderSort, 'sortLeaders')}</div>`
      : t ? '<p class="muted">This team has no players yet.</p>' : ''}
    ${statFootnote}`;
}

// Every season added up, one row per person (their latest name and team).
function renderAllTimeLeaders() {
  const people = allTimeStats();
  leaderSort = sortKeyFor(leaderSort);
  const byPerson = {};
  for (const p of allPlayers()) byPerson[p.personId] = [...(byPerson[p.personId] || []), p];
  const rows = sortRows(Object.entries(byPerson).map(([personId, entries]) => {
    const latest = entries.sort((a, b) => (db.seasons.find(s => s.id === b.team.seasonId)?.number || 0) - (db.seasons.find(s => s.id === a.team.seasonId)?.number || 0))[0];
    return { ...latest, seasons: new Set(entries.map(e => e.team.seasonId)).size, ...(people[personId] || finishPlayer(ZERO())),
      inHof: db.hof.some(h => h.person_id === personId) };
  }), leaderSort);
  const nameCol = { k: 'name', h: 'Player', l: true, f: r => `<a href="#/profile/${r.id}" style="color:inherit">${r.inHof ? '🏆 ' : ''}${esc(r.name)}</a>
    <div class="muted" style="font-size:12px">${r.seasons} season${r.seasons === 1 ? '' : 's'}</div>` };
  app.innerHTML = `
    <div class="row"><h1>Leaders</h1><a class="btn small" href="#/hof">🏆 Hall of Fame</a>
      <button class="small" onclick="exportPlayerStats()" title="Download as a spreadsheet">⬇ CSV</button></div>
    ${seasonPicker('pickLeaderSeason', [['all', 'All time', true]])}
    <p class="muted">All-time stats across ${db.seasons.length} season${db.seasons.length === 1 ? '' : 's'}. Players linked across seasons are added up as one person.</p>
    ${statCatTabs('renderLeaders()')}
    ${rows.length ? `<div class="card">${statTable(rows, statCols(nameCol), leaderSort, 'sortLeaders')}</div>` : '<p class="muted">No players yet.</p>'}
    ${statFootnote}`;
}

// ---------- Hall of Fame ----------
let hofPicking = false, hofQuery = '';

function renderHallOfFame() {
  if (!db.seasonsReady) { location.hash = '#/leaders'; return; }
  const people = allTimeStats();
  const card = h => {
    const s = people[h.person_id] || finishPlayer(ZERO()), entries = personEntries(h.person_id), latest = entries.at(-1);
    return `<div class="card hof-card">
      <div class="row"><span class="hof-trophy">${latest ? avatar(latest, 48) : '🏆'}</span>
        <span style="flex:1"><b>${latest ? `<a href="#/profile/${latest.id}" style="color:inherit">${esc(h.name)}</a>` : esc(h.name)}</b>
          <div class="muted" style="font-size:13px">Inducted${h.season_id ? ` after ${esc(seasonName(h.season_id))}` : ''} ·
            ${entries.length} season${entries.length === 1 ? '' : 's'}${latest ? ` · ${esc(latest.team.name)}` : ''}</div></span>
        ${isAdmin() ? `<button class="small" onclick="removeFromHof('${h.id}')">Remove</button>` : ''}</div>
      ${h.note ? `<p class="hof-note">“${esc(h.note)}”</p>` : ''}
      <div class="hof-stats">${[['Goals', s.g], ['Assists', s.a], ['Ds', s.d], ['Points', s.pp], ['+/-', s.pm > 0 ? `+${s.pm}` : s.pm]]
        .map(([k, v]) => `<span><b>${v}</b>${k}</span>`).join('')}</div>
    </div>`;
  };
  // Admins pick inductees from everyone who has played, best all-time +/- first.
  const candidates = () => {
    const seen = new Set(db.hof.map(h => h.person_id)), latest = {};
    for (const p of allPlayers()) {
      const num = db.seasons.find(s => s.id === p.team.seasonId)?.number || 0;
      if (!seen.has(p.personId) && (!latest[p.personId] || num > latest[p.personId].num)) latest[p.personId] = { ...p, num };
    }
    const q = hofQuery.trim().toLowerCase();
    return Object.values(latest).filter(p => !q || p.name.toLowerCase().includes(q))
      .map(p => ({ ...p, s: people[p.personId] || finishPlayer(ZERO()) }))
      .sort((a, b) => b.s.pm - a.s.pm || b.s.g - a.s.g).slice(0, 40);
  };
  app.innerHTML = `
    <div class="row"><h1>🏆 Hall of Fame</h1><a class="btn small" href="#/leaders">← Leaders</a></div>
    <p class="muted">${esc(league.name)}’s greatest players, with their all-time stats.</p>
    ${db.hof.length ? [...db.hof].reverse().map(card).join('') : '<div class="card muted">No one has been inducted yet.</div>'}
    ${isAdmin() ? (hofPicking ? `
      <h2>Induct a player</h2>
      <input id="hof-q" placeholder="Search players" value="${esc(hofQuery)}" autocomplete="off"
        oninput="hofQuery = this.value; renderHallOfFame(); const i = document.getElementById('hof-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length)">
      <div class="card" style="margin-top:10px">${candidates().map(p => `
        <div class="claim-row"><span><b>${esc(p.name)}</b> <span class="muted">· ${esc(p.team.name)} · ${esc(seasonName(p.team.seasonId))}</span>
          <div class="muted" style="font-size:12px">All time: ${p.s.g} G · ${p.s.a} A · ${p.s.d} D · ${p.s.pm > 0 ? '+' : ''}${p.s.pm}</div></span>
          <button class="small primary" onclick="induct('${p.personId}')">Induct</button></div>`).join('') || '<div class="muted">No players match.</div>'}
      </div>
      <button style="width:100%" onclick="hofPicking = false; renderHallOfFame()">Done</button>`
    : '<button class="primary" style="width:100%;margin-top:6px" onclick="hofPicking = true; renderHallOfFame()">+ Induct players</button>') : ''}`;
}

function induct(personId) {
  const latest = personEntries(personId).at(-1);
  const note = prompt(`Induct ${latest.name} into the Hall of Fame.\n\nAdd a short note (optional), e.g. “3× league MVP”:`, '');
  if (note === null) return;
  const archived = db.seasons.filter(s => s.status === 'archived').at(-1);
  const row = { id: uid(), league_id: league.id, person_id: personId, name: latest.name,
    season_id: archived?.id || activeSeason()?.id || null, note: note.trim().slice(0, 280) || null, inducted_at: new Date().toISOString() };
  db.hof.push(row);
  persist({ upsert: 'hall_of_fame', rows: [row] });
  toast(`🏆 ${latest.name} is in the Hall of Fame!`);
  renderHallOfFame();
}

function removeFromHof(id) {
  const h = db.hof.find(x => x.id === id);
  if (!confirm(`Remove ${h.name} from the Hall of Fame?`)) return;
  db.hof = db.hof.filter(x => x.id !== id);
  persist({ del: 'hall_of_fame', vals: [id] });
  renderHallOfFame();
}

// ---------- Team stats page ----------
let teamSort = 'pm';
function sortTeam(k) { teamSort = k; route(); }

function renderTeamPage(tid) {
  const t = team(tid);
  if (!t) { location.hash = '#/teams'; return; }
  const games = db.games.filter(g => g.homeId === tid || g.awayId === tid);
  const an = analyze(games.filter(countsInSeason));   // playoff games count only if the season's playoff-stats choice says so
  const ts = an.teams[tid] || { ...TEAM_ZERO(), w: 0, l: 0, t: 0, gp: 0, offProd: null, conv: null };
  const diff = ts.scored - ts.allowed;
  teamSort = sortKeyFor(teamSort);
  const rows = sortRows(t.players.map(p => ({ ...p, team: t, ...statsOf(an, p.id) })), teamSort);
  const flows = an.flows.filter(f => t.players.some(p => p.id === f.g));
  const played = games.filter(g => g.status !== 'scheduled').sort((x, y) => y.created - x.created);
  app.innerHTML = `
    <div class="row"><h1><span class="dot" style="background:${teamBg(t)}"></span>${esc(t.name)}</h1>
      <a class="btn small" href="#/leaders">← Leaders</a></div>
    <p class="muted">${ts.gp} game${ts.gp === 1 ? '' : 's'} played</p>
    ${tiles([
      ['Record', `${ts.w}–${ts.l}${ts.t ? `–${ts.t}` : ''}`, 'Finished games'],
      ['Point spread', `${ts.scored}–${ts.allowed}`, `${diff > 0 ? '+' : ''}${diff} goal difference`],
      ['Offensive productivity', fmtPct(ts.offProd), 'Holds ÷ O-line points'],
      ['Conversion rate', fmtPct(ts.conv), 'Goals ÷ (O points + opponent turnovers)'],
      ['Holds', `${ts.holds}`, `of ${ts.oPts} O-line points`],
      ['Breaks', `${ts.breaks}`, `of ${ts.dPts} D-line points`]
    ])}
    ${possessionChart(an.possessions.filter(p => p.team === tid))}
    ${pointsPerLineChart(ts, t.name)}
    ${flowChart(flows)}
    <h2>Player stats</h2>
    ${statCatTabs('route()')}
    ${rows.length ? `<div class="card">${statTable(rows, statCols(playerNameCol(false)), teamSort, 'sortTeam')}</div>` : '<p class="muted">No players yet.</p>'}
    ${statFootnote}
    <h2>Games</h2>
    ${played.length ? played.map(gameCard).join('') : '<p class="muted">No games yet.</p>'}`;
}

// ---------- Teams & rosters ----------
// A draft copy of the team being edited. Changes only reach db when Save is tapped.
let editing = null;

function renderTeams() {
  const teams = seasonTeams(), edit = canEdit();
  app.innerHTML = `
    <h1>Teams</h1>
    ${seasonPicker('pickSeason')}
    ${viewingPast() ? `<div class="card past-season">📚 ${esc(viewSeason().name)} is finished, so its teams can’t be changed.</div>` : ''}
    ${isTeamMode() && !edit ? '<p class="muted">You can edit the teams you manage. Other teams are read-only.</p>' : ''}

        <input id="tc" type="color" value="#f39c12" aria-label="Main colour">

function teamCard(t, edit = true) {

    <div class="card">
      <div class="row" style="margin-bottom:6px">

function teamEditor(t) {
  return `
    <div class="card" style="border:2px solid var(--accent)">
      <div class="muted" style="margin-bottom:6px">Team name and colour</div>
      <div class="row">
        <input value="${esc(t.name)}" placeholder="Team name" maxlength="40" oninput="editing.name = this.value">
        <input type="color" value="${esc(t.color)}" oninput="editing.color = this.value; previewTeamColor()" aria-label="Main colour">
        ${db.color2Ready && t.color2 ? `<input type="color" value="${esc(t.color2)}" oninput="editing.color2 = this.value; previewTeamColor()" aria-label="Second colour">` : ''}
      </div>
      ${db.color2Ready ? `<label class="color2-toggle">
        <input type="checkbox" ${t.color2 ? 'checked' : ''} onchange="editing.color2 = this.checked ? (editing.color2 || '#ffffff') : null; renderTeams()">
        Two colours <span class="dot big-dot" id="team-color-preview" style="background:${teamBg(t)}"></span></label>` : ''}
      <div class="muted" style="margin:16px 0 6px">Players</div>
      <ul class="roster">${t.players.map((p, i) => `
        <li class="row">
          <input value="${esc(p.number)}" placeholder="#" inputmode="numeric" style="flex:0 0 64px"
            oninput="editing.players[${i}].number = this.value">

      </ul>
      <div class="row">
        <input id="new-num" placeholder="#" inputmode="numeric" style="flex:0 0 64px">

          oninput="suggestPlayers(this.value)" onkeydown="if (event.key === 'Enter') draftAddPlayer()">
        <button class="small" onclick="draftAddPlayer()">Add</button>
      </div>
      <div id="suggest"></div>
      <div class="row" style="margin-top:18px">
        ${isAdmin() ? '<button onclick="deleteTeam()">Delete team</button>' : ''}
        <button onclick="cancelEdit()">Cancel</button>
        <button class="primary" onclick="saveTeam()">Save</button>
      </div>
    </div>`;
}

function previewTeamColor() {
  const el = document.getElementById('team-color-preview');
  if (el) el.style.background = teamBg(editing);
}

function editTeam(id) {
  if (editing && editing.id !== id && !confirm(`Discard your unsaved changes to ${team(editing.id).name}?`)) return;
  editing = structuredClone(team(id));
  renderTeams();
}

function draftAddPlayer() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) return;
  editing.players.push({ id: uid(), name, number: document.getElementById('new-num').value.trim() });
  renderTeams();
  document.getElementById('new-num').focus();
}

// While typing a new player's name, offer players from past seasons with a matching name. Picking one
// links them to that person, so their all-time stats continue while this season's stats start fresh.
function returningPlayers(query) {
  const q = query.trim().toLowerCase();
  if (q.length < 2 || !db.seasonsReady) return [];
  const here = new Set([...seasonTeams().flatMap(t => t.players), ...editing.players].map(p => p.personId || p.id));
  const latest = {};   // personId → their most recent past-season roster entry
  for (const p of allPlayers()) {
    if (inActiveSeason(p.team) || here.has(p.personId)) continue;
    if (!p.name.toLowerCase().includes(q)) continue;
    const num = db.seasons.find(s => s.id === p.team.seasonId)?.number || 0;
    if (!latest[p.personId] || num > latest[p.personId].num) latest[p.personId] = { ...p, num };
  }
  return Object.values(latest).sort((a, b) => a.name.localeCompare(b.name)).slice(0, 6);
}

function suggestPlayers(query) {
  const box = document.getElementById('suggest');
  const list = returningPlayers(query);
  box.innerHTML = list.length ? `<div class="suggest">
    <div class="muted" style="font-size:13px">Returning player? Tap to link them so their all-time stats carry on:</div>
    ${list.map(p => `<button class="small" onclick="addReturningPlayer('${p.id}')">↺ ${esc(p.name)}
      <span class="muted">#${esc(p.number)} · ${esc(p.team.name)} · ${esc(seasonName(p.team.seasonId))}</span></button>`).join('')}
  </div>` : '';
}

function addReturningPlayer(pid) {
  const p = allPlayers().find(x => x.id === pid);
  const typedNum = document.getElementById('new-num').value.trim();
  // Same person, new roster entry for this season. If they'd claimed their player, their account comes with them.
  editing.players.push({ id: uid(), name: p.name, number: typedNum || p.number, personId: p.personId, userId: p.userId || null, carryUser: !!p.userId });
  renderTeams();
  document.getElementById('new-name').focus();
}

function draftRemovePlayer(i) {
  const pid = editing.players[i].id;
  const used = db.games.some(g => g.events.some(e => e.playerId === pid || e.assistId === pid));
  if (used) return alert('This player has recorded stats, so they can’t be removed. You can still rename them.');
  editing.players.splice(i, 1);
  renderTeams();
}

function saveTeam() {
  editing.name = editing.name.trim();
  editing.players.forEach(p => { p.name = p.name.trim(); p.number = String(p.number).trim(); });
  if (!editing.name) return alert('The team needs a name.');
  if (editing.players.some(p => !p.name)) return alert('Every player needs a name.');
  const i = db.teams.findIndex(t => t.id === editing.id);
  if (i < 0) { editing = null; renderTeams(); return alert('Another admin deleted this team, so your changes weren’t saved.'); }
  const t = editing, removed = db.teams[i].players.filter(p => !t.players.some(x => x.id === p.id)).map(p => p.id);
  const row = teamRow(t), rows = playerRows(t);
  db.teams[i] = t;
  persist({ upsert: 'teams', rows: [row] }, rows.length && { upsert: 'players', rows }, removed.length && { del: 'players', vals: removed });
  editing = null; renderTeams();
}

function cancelEdit() { editing = null; renderTeams(); }

// The Delete button in the team editor.
function deleteTeam() { deleteTeamById(editing.id); }

// Delete a team and its roster. If it has games, those games (and all their plays and stats) go too,
// since a game can't exist without both teams, so that case asks for the team's name to be typed.
function deleteTeamById(id) {
  const t = team(id);
  const games = db.games.filter(g => g.homeId === id || g.awayId === id);
  if (games.length) {
    const played = games.filter(g => g.status !== 'scheduled').length, scheduled = games.length - played;
    const parts = [played && `${played} played game${played === 1 ? '' : 's'}`, scheduled && `${scheduled} scheduled game${scheduled === 1 ? '' : 's'}`].filter(Boolean).join(' and ');
    const typed = prompt(`Deleting ${t.name} also permanently deletes its ${parts}, including every stat recorded in them `
      + `(for both teams). This can’t be undone.\n\nType the team name to confirm:`);
    if (typed === null) return;
    if (typed.trim().toLowerCase() !== t.name.trim().toLowerCase()) return alert('The name didn’t match, so nothing was deleted.');
  } else if (!confirm(`Delete ${t.name} and its roster (${t.players.length} player${t.players.length === 1 ? '' : 's'})?`)) return;

  const gameIds = games.map(g => g.id);
  db.games = db.games.filter(g => !gameIds.includes(g.id));
  db.teams = db.teams.filter(x => x.id !== id);
  persist(gameIds.length && { del: 'games', vals: gameIds },   // plays go with their games
    { del: 'teams', vals: [id] });                               // players go with their team
  if (editing?.id === id) editing = null;
  toast(`Deleted ${t.name}${gameIds.length ? ` and ${gameIds.length} game${gameIds.length === 1 ? '' : 's'}` : ''}.`);
  renderTeams();
}

function addTeam() {
  const n = document.getElementById('tn').value.trim();
  if (!n) return;
  const color2 = document.getElementById('tc2-on')?.checked ? document.getElementById('tc2').value : null;
  const t = { id: uid(), name: n, color: document.getElementById('tc').value, color2, players: [], seasonId: activeSeason()?.id || null };
  db.teams.push(t);
  const row = teamRow(t);
  persist({ upsert: 'teams', rows: [row] });
  editing = structuredClone(t); // open the new team straight away so players can be added
  renderTeams();
  document.getElementById('new-name').focus();
}

function resetAll() {
  const s = activeSeason();
  if (!confirm(`Erase all teams, games and stats in ${s ? s.name : league.name} and replace them with sample teams? Past seasons aren’t affected.`)) return;
  const sid = s?.id || null, fresh = seed().teams.map(t => ({ ...t, seasonId: sid }));
  const oldGames = db.games.filter(inActiveSeason).map(g => g.id), oldTeams = db.teams.filter(inActiveSeason).map(t => t.id);
  db.games = db.games.filter(g => !oldGames.includes(g.id));
  db.teams = [...db.teams.filter(t => !oldTeams.includes(t.id)), ...fresh];
  editing = null;
  const teams = fresh.map(teamRow), players = fresh.flatMap(playerRows);
  persist(oldGames.length && { del: 'games', vals: oldGames },   // plays are removed with their games
    oldTeams.length && { del: 'teams', vals: oldTeams },           // players are removed with their teams
    { upsert: 'teams', rows: teams }, { upsert: 'players', rows: players });
  location.hash = '#/games'; route();
}

// ---------- Sign in / sign up ----------
const authUrl = () => location.origin + location.pathname;

function renderLogin() {
  const up = authMode === 'signup';
  app.innerHTML = `
    <div class="card auth">
      <h1>${up ? 'Create an account' : 'Sign in'}</h1>
      <form onsubmit="submitAuth(event)">
        <input id="email" type="email" autocomplete="email" placeholder="Email" required>
        <input id="pw" type="password" autocomplete="${up ? 'new-password' : 'current-password'}"
          placeholder="Password${up ? ' (6+ characters)' : ''}" minlength="6" required>
        <button class="primary" id="authBtn">${up ? 'Create account' : 'Sign in'}</button>
      </form>
      <div id="authMsg" class="msg"></div>
      <div class="links">
        <a onclick="authMode='${up ? 'signin' : 'signup'}';renderLogin()">${up ? 'Have an account? Sign in' : 'New here? Create an account'}</a>
        ${up ? '' : '<a onclick="forgotPassword()">Forgot password?</a>'}
      </div>
    </div>`;
}

function authMsg(text, isError) {
  const m = document.getElementById('authMsg');
  m.textContent = text; m.classList.toggle('error', !!isError);
}

async function submitAuth(ev) {
  ev.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('pw').value;
  const btn = document.getElementById('authBtn');
  btn.disabled = true; authMsg('');
  const { data, error } = authMode === 'signup'
    ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: authUrl() } })
    : await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if (error) {
    // Never clicked (or lost) the confirmation email: offer to send a new one.
    if (/not confirmed/i.test(error.message)) {
      authMsg('Your email isn’t confirmed yet. Check your inbox for the link, or send a new one.', true);
      document.getElementById('authMsg').insertAdjacentHTML('beforeend',
        ' <button class="small" type="button" onclick="resendConfirmation()">Resend confirmation email</button>');
      return;
    }
    return authMsg(error.message, true);
  }
  // If email confirmation is on, sign-up returns no session until the link is clicked.
  if (authMode === 'signup' && !data.session) authMsg('Check your email for a confirmation link, then sign in.');
}

async function resendConfirmation() {
  const email = document.getElementById('email').value.trim();
  if (!email) return authMsg('Type your email above first.', true);
  const { error } = await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: authUrl() } });
  authMsg(error ? error.message : 'Sent! Open the newest email and tap its link, then come back and sign in.', !!error);
}

async function forgotPassword() {
  const email = document.getElementById('email').value.trim();
  if (!email) return authMsg('Type your email above first.', true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: authUrl() });
  authMsg(error ? error.message : 'If that email has an account, a reset link is on its way.', !!error);
}

function renderNewPassword() {
  app.innerHTML = `
    <div class="card auth">
      <h1>Choose a new password</h1>
      <form onsubmit="saveNewPassword(event)">
        <input id="pw" type="password" autocomplete="new-password" placeholder="New password (6+ characters)" minlength="6" required>
        <button class="primary">Save password</button>
      </form>
      <div id="authMsg" class="msg"></div>
    </div>`;
}

async function saveNewPassword(ev) {
  ev.preventDefault();
  const { error } = await sb.auth.updateUser({ password: document.getElementById('pw').value });
  if (error) return authMsg(error.message, true);
  recovering = false; route();
}

async function signOut() {
  const waiting = writes.length
    ? `\n\n${writes.length} change${writes.length === 1 ? ' hasn’t' : 's haven’t'} been sent yet. ${writes.length === 1 ? 'It stays' : 'They stay'} on this device and will be sent next time you sign in here.` : '';
  if (confirm(`Sign out on this device?${waiting}`)) await sb.auth.signOut();
}

function renderSetup() {
  app.innerHTML = `
    <div class="card auth">
      <h1>Almost ready</h1>
      <p>Sign-in needs a Supabase project. Open <code>index.html</code> and fill in
      <code>SUPABASE_URL</code> and <code>SUPABASE_KEY</code> near the top of the script.</p>
      ${window.supabase ? '' : '<p class="msg error">The Supabase library didn’t load — check your internet connection.</p>'}
    </div>`;
}

if (sb) {
  // Fires once on load with any saved session, then on every sign in / sign out.
  // Installable app: keep the app's files for offline use (needs https, or localhost for testing).
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  let restoredFor = null;
  sb.auth.onAuthStateChange((event, s) => {
    // Supabase also fires this for routine things (refreshing the login, returning to the tab). Only redraw
    // when who's signed in actually changes, so an open pop-up (e.g. picking who caught a goal) isn't closed.
    const changed = !authReady || (s?.user.id || null) !== (session?.user.id || null) || event === 'PASSWORD_RECOVERY';
    session = s; authReady = true;
    if (event === 'PASSWORD_RECOVERY') recovering = true;
    // Unsent changes stay saved on the device (under that account) when signing out.
    if (event === 'SIGNED_OUT') { writes = []; restoredFor = null; leaveLeague(); location.hash = '#/'; }
    if (!changed) return;
    setTimeout(() => {   // don't call Supabase from inside this callback
      if (s && restoredFor !== s.user.id) { restoredFor = s.user.id; restoreQueue(); }
      route();
    });
  });
}
route();
</script>
